<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kitchen</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script></head><body class="bg-black text-white p-4"><h1 class="text-2xl font-bold">🔥 Kitchen - NEW ORDERS</h1><div id="orders" class="mt-6 grid md:grid-cols-2 gap-4"></div><audio id="beep" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio><script>const firebaseConfig={apiKey:"AIzaSyBXOE8w7uZQA4YwXyqz8b8cMoNsp84n7RY",authDomain:"quickbite-kataza.firebaseapp.com",projectId:"quickbite-kataza",storageBucket:"quickbite-kataza.firebasestorage.app",messagingSenderId:"584517077834",appId:"1:584517077834:web:9465cd7f4183561e880fb3"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();let first=true;db.collection('orders').where('status','in',['new','preparing']).orderBy('created_at','desc').onSnapshot(s=>{if(!first&&s.docChanges().some(c=>c.type=='added'))document.getElementById('beep').play();first=false;orders.innerHTML=s.docs.map(d=>{let o=d.data();return `<div class="bg-white text-black p-5 rounded-[20px]"><h2 class="font-bold">${o.customer_name} - ${o.area} (${o.delivery_fee})</h2><p class="text-xs">${o.location} • ${o.customer_phone}</p><div class="mt-3 text-sm font-bold">${o.items.map(i=>`<div>${i.qty}x ${i.name}</div>`).join('')}</div><p class="text-xs mt-2">${o.note||''}</p><p class="font-bold mt-2">UGX ${o.total}</p><button onclick="db.collection('orders').doc('${d.id}').update({status:'preparing'})" class="bg-black text-white px-4 py-2 rounded-full text-xs mt-3">Preparing</button><button onclick="db.collection('orders').doc('${d.id}').update({status:'served'})" class="bg-green-600 text-white px-4 py-2 rounded-full text-xs mt-3 ml-2">Done</button></div>`}).join('');});</script></body></html>
