<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kitchen</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script></head><body class="bg-black text-white p-6"><h1 class="text-[#D4B67A] text-3xl font-black">KITCHEN — NEW ORDERS</h1><div id="list" class="mt-6 grid gap-4"></div><audio id="beep" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio><script>const firebaseConfig={apiKey:"REPLACE",authDomain:"REPLACE",projectId:"REPLACE",storageBucket:"REPLACE",appId:"REPLACE"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();let last=0;db.collection('orders').where('status','==','new').onSnapshot(s=>{if(s.size>last&&last!=0)beep.play();last=s.size;list.innerHTML=s.docs.map(d=>{let o=d.data();return `<div class="bg-[#1A1A1A] p-6 rounded-[24px] border-2 border-[#D4B67A]"><p class="text-2xl font-black">${o.area} - ${o.location} - ${o.customer_name}</p><p class="mt-2 text-[#D4B67A]">Fee: UGX ${o.delivery_fee}</p><p class="mt-3 text-xl">${o.items.map(i=>i.name+' x'+i.qty).join(', ')}</p><p class="text-sm text-white/50 mt-2">${o.note||''} • ${o.customer_phone}</p><button onclick="db.collection('orders').doc('${d.id}').update({status:'preparing'})" class="mt-4 bg-[#D4B67A] text-black px-8 py-3 rounded-full font-black">START COOKING</button></div>`}).join('');});</script></body></html>
