<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Quick Bite</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script></head><body class="bg-[#F5F1E9] p-6"><div class="max-w-6xl mx-auto"><h1 class="text-[28px] font-bold">Quick Bite Admin</h1><p class="text-xs text-black/50">quickbite-kataza.firebaseapp.com</p>

<div class="bg-[#0A0A0A] text-white p-6 rounded-[24px] mt-6">
<h2 class="text-[#D4B67A] text-[12px] tracking-[3px] font-bold">HERO BANNERS — MAX 7 (Auto 4s)</h2><p class="text-white/50 text-[11px] mt-2" id="bannerCount">0/7</p>
<div class="grid md:grid-cols-2 gap-3 mt-4"><input id="bTitle" placeholder="Title e.g 50% OFF Lunch" class="bg-white/10 rounded-full px-4 py-3 text-xs outline-none"><input id="bSub" placeholder="Subtitle e.g Mon-Fri 12-3pm" class="bg-white/10 rounded-full px-4 py-3 text-xs outline-none"></div>
<input id="bannerFile" type="file" accept="image/*" class="mt-3 text-xs"><button onclick="addBanner()" id="bannerBtn" class="mt-3 bg-[#D4B67A] text-black px-6 py-3 rounded-full text-xs font-bold w-full">ADD BANNER</button>
<div id="bannerList" class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-3"></div>
</div>

<div class="mt-6 bg-white p-6 rounded-[24px]"><h2 class="font-bold">Seed Local Menu - One Click</h2><p class="text-[11px] text-black/50 mt-1">Rolex (4) + Fries (5) + Juice (3) + Soda (2) = 14 dishes</p><button onclick="seedMenu()" id="seedBtn" class="bg-[#0A0A0A] text-[#D4B67A] px-6 py-3 rounded-full text-xs font-bold mt-3">SEED FULL MENU</button></div>

<div class="mt-6 grid md:grid-cols-2 gap-6"><div class="bg-white p-6 rounded-[24px]"><h2 class="font-bold text-sm">Add Dish</h2><input id="name" placeholder="Name" class="w-full bg-[#F5F1E9] rounded-full px-4 py-3 mt-3 text-sm outline-none"><input id="price" type="number" placeholder="Price UGX" class="w-full bg-[#F5F1E9] rounded-full px-4 py-3 mt-3 text-sm outline-none"><input id="cat" placeholder="Category (Rolex/Fries/Juice/Soda)" class="w-full bg-[#F5F1E9] rounded-full px-4 py-3 mt-3 text-sm outline-none"><input id="desc" placeholder="Description" class="w-full bg-[#F5F1E9] rounded-full px-4 py-3 mt-3 text-sm outline-none"><input id="file" type="file" accept="image/*" class="mt-3 text-xs"><button onclick="addDish()" id="ubtn" class="w-full bg-[#0A0A0A] text-[#D4B67A] py-3.5 mt-4 rounded-full font-bold text-xs">ADD DISH</button></div><div><h2 class="font-bold">Live Orders</h2><div id="orders" class="mt-3 space-y-2 max-h-[600px] overflow-auto"></div></div></div>

<h2 class="mt-8 font-bold">Menu (<span id="foodCount">0</span>)</h2><div id="foods" class="mt-3 grid md:grid-cols-4 gap-3"></div></div><script>
const firebaseConfig={apiKey:"AIzaSyBXOE8w7uZQA4YwXyqz8b8cMoNsp84n7RY",authDomain:"quickbite-kataza.firebaseapp.com",projectId:"quickbite-kataza",storageBucket:"quickbite-kataza.firebasestorage.app",messagingSenderId:"584517077834",appId:"1:584517077834:web:9465cd7f4183561e880fb3"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
async function addBanner(){let snap=await db.collection('banners').get();if(snap.size>=7)return alert('Max 7 reached. Delete one.');let file=bannerFile.files[0];if(!file)return alert('Select image');bannerBtn.innerText='Uploading...';let ref=firebase.storage().ref('banners/'+Date.now()+'_'+file.name);await ref.put(file);let url=await ref.getDownloadURL();await db.collection('banners').add({url,title:bTitle.value,subtitle:bSub.value,order:snap.size,created_at:firebase.firestore.FieldValue.serverTimestamp()});bannerBtn.innerText='ADD BANNER';bTitle.value='';bSub.value='';bannerFile.value='';}
db.collection('banners').orderBy('order').onSnapshot(s=>{bannerCount.innerText=s.size+'/7 used';bannerList.innerHTML=s.docs.map(d=>{let b=d.data();return `<div class="bg-white/10 rounded-[16px] p-3 flex gap-3"><img src="${b.url}" class="w-20 h-14 rounded-lg object-cover"><div class="flex-1"><p class="text-xs font-bold truncate">${b.title||'No title'}</p><p class="text-[10px] text-white/50 truncate">${b.subtitle||''}</p><div class="flex gap-2 mt-2"><button onclick="editBanner('${d.id}')" class="text-[10px] bg-white text-black px-3 py-1 rounded-full">Edit</button><button onclick="db.collection('banners').doc('${d.id}').delete()" class="text-[10px] bg-red-500 px-3 py-1 rounded-full">Delete</button></div></div></div>`}).join('');});
async function editBanner(id){let doc=await db.collection('banners').doc(id).get();let b=doc.data();let nt=prompt('Title',b.title);if(nt===null)return;let ns=prompt('Subtitle',b.subtitle);if(ns===null)return;await db.collection('banners').doc(id).update({title:nt,subtitle:ns});}
async function seedMenu(){if(!confirm('Add 14 local dishes?'))return;seedBtn.innerText='Seeding...';const menu=[{name:"Rolex One Egg",price:3500,category:"Rolex",description:"Classic Rolex 1 egg, tomato, cabbage, chapati",image_url:"https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=500"},{name:"Rolex Two Eggs",price:5000,category:"Rolex",description:"Double egg Rolex, more filling",image_url:"https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=500"},{name:"Rolex Special",price:7000,category:"Rolex",description:"2 eggs + minced meat + cheese + avocado",image_url:"https://images.unsplash.com/photo-1604908177225-81e2e13d8a3a?w=500"},{name:"Rolex + Fries",price:8000,category:"Rolex",description:"One egg Rolex + fries",image_url:"https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=500"},{name:"Fries Plain",price:5000,category:"Fries",description:"Crispy hot fries + ketchup",image_url:"https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=500"},{name:"Fries + Rice + Gravy",price:7000,category:"Fries",description:"Half fries half rice with beef gravy",image_url:"https://images.unsplash.com/photo-1604908177453-7462958d0287?w=500"},{name:"Fries with Gravy",price:6000,category:"Fries",description:"Fries topped with rich beef gravy",image_url:"https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?w=500"},{name:"Fries with Chicken",price:12000,category:"Fries",description:"Fries + grilled chicken piece",image_url:"https://images.unsplash.com/photo-1598103442097-8b74394b95c6?w=500"},{name:"Fries with Meat",price:10000,category:"Fries",description:"Fries + fried beef strips",image_url:"https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500"},{name:"Passion Juice",price:3000,category:"Juice",description:"Fresh passion 500ml",image_url:"https://images.unsplash.com/photo-1621506289937-a8e4df240d0b?w=500"},{name:"Mango Juice",price:3000,category:"Juice",description:"Fresh mango 500ml",image_url:"https://images.unsplash.com/photo-1623065422902-30a2d299bbe4?w=500"},{name:"Pineapple Juice",price:3000,category:"Juice",description:"Fresh pineapple 500ml",image_url:"https://images.unsplash.com/photo-1523677011781-c91d1bbe2f9e?w=500"},{name:"Soda - Coke/Fanta/Sprite",price:2000,category:"Soda",description:"300ml cold - choose in note",image_url:"https://images.unsplash.com/photo-1624552184280-9e9631bbeee9?w=500"},{name:"Water 500ml",price:1000,category:"Soda",description:"Mineral water",image_url:"https://images.unsplash.com/photo-1548839140-29a749e1cf4d?w=500"}];for(let item of menu){await db.collection('products').add({...item,is_available:true,created_at:firebase.firestore.FieldValue.serverTimestamp()});}seedBtn.innerText='SEED FULL MENU';alert('14 dishes added!');}
async function addDish(){ubtn.innerText='Uploading...';let file=document.getElementById('file').files[0],url='';if(file){let ref=firebase.storage().ref('foods/'+Date.now()+'_'+file.name);await ref.put(file);url=await ref.getDownloadURL();}await db.collection('products').add({name:name.value,price:+price.value,category:cat.value,description:desc.value,image_url:url,is_available:true,created_at:firebase.firestore.FieldValue.serverTimestamp()});ubtn.innerText='ADD DISH';name.value='';price.value='';}
db.collection('products').onSnapshot(s=>{foodCount.innerText=s.size;foods.innerHTML=s.docs.map(d=>{let f=d.data();return `<div class="bg-white rounded-[16px] overflow-hidden"><img src="${f.image_url}" class="h-28 w-full object-cover"><div class="p-3 text-xs"><b>${f.name}</b> UGX ${f.price}<br><span class="text-[10px] text-black/40">${f.category}</span><br><button onclick="db.collection('products').doc('${d.id}').delete()" class="text-red-500 mt-1">Delete</button> <button onclick="db.collection('products').doc('${d.id}').update({is_available:${!f.is_available}})" class="ml-2">${f.is_available?'Hide':'Show'}</button></div></div>`}).join('');});
db.collection('orders').orderBy('created_at','desc').limit(30).onSnapshot(s=>{orders.innerHTML=s.docs.map(d=>{let o=d.data();return `<div class="bg-white p-3 rounded-[12px] text-xs border-l-4 ${o.status=='new'?'border-red-500':'border-green-500'}"><b>${o.customer_name} • ${o.customer_phone}</b><br>${o.area} (${o.delivery_fee}) • ${o.location}<br>${o.items.map(i=>i.name+' x'+i.qty).join(', ')}<br><b>UGX ${o.total}</b> • ${o.status}<br><select onchange="db.collection('orders').doc('${d.id}').update({status:this.value})" class="border rounded-full px-2 py-1 mt-1"><option>${o.status}</option><option>preparing</option><option>on the way</option><option>served</option></select></div>`}).join('');});
</script></body></html>
