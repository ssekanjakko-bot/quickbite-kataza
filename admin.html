<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Quick Bite Kataza REAL</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script>
<style>body{background:#F5F1E9;font-family:system-ui}.tab-active{background:#0A0A0A;color:#D4B67A}</style>
</head>
<body>
<div class="max-w-7xl mx-auto p-4 md:p-6">
<div class="flex justify-between items-center">
<div><h1 class="text-2xl font-bold">Quick Bite Admin REAL</h1><p class="text-[11px] text-black/40" id="conn">Connecting...</p></div>
<button onclick="clearFake()" class="bg-red-600 text-white text-[10px] px-4 py-2 rounded-full font-bold">DELETE FAKE (Unsplash)</button>
</div>

<!-- STATS -->
<div class="grid grid-cols-4 gap-3 mt-6">
<div class="bg-white p-4 rounded-[18px]"><p class="text-[10px] tracking-widest opacity-50">LIVE</p><p id="liveCount" class="text-xl font-bold">0</p></div>
<div class="bg-white p-4 rounded-[18px]"><p class="text-[10px] tracking-widest opacity-50">COMPLETED</p><p id="doneCount" class="text-xl font-bold">0</p></div>
<div class="bg-white p-4 rounded-[18px]"><p class="text-[10px] tracking-widest opacity-50">CANCELED</p><p id="cancelCount" class="text-xl font-bold">0</p></div>
<div class="bg-white p-4 rounded-[18px]"><p class="text-[10px] tracking-widest opacity-50">TODAY UGX</p><p id="todaySales" class="text-xl font-bold">0</p></div>
</div>

<div class="grid lg:grid-cols-[380px_1fr] gap-6 mt-6">
<!-- LEFT: ADD -->
<div class="space-y-6">
<div class="bg-[#0A0A0A] text-white p-5 rounded-[24px]">
<h2 class="text-[#D4B67A] text-[11px] tracking-[3px] font-bold">BANNERS MAX 7</h2><p id="bannerCount" class="text-white/40 text-[11px] mt-1">0/7</p>
<input id="bTitle" placeholder="Banner Title" class="w-full bg-white/10 rounded-full px-4 py-3 text-xs mt-4 outline-none">
<input id="bannerFile" type="file" accept="image/*" class="mt-3 w-full text-xs text-white/70">
<button onclick="addBanner()" id="bannerBtn" class="w-full mt-3 bg-[#D4B67A] text-black py-3 rounded-full text-xs font-bold">ADD BANNER</button>
<div id="bannerList" class="mt-4 space-y-2"></div>
</div>

<div class="bg-white p-5 rounded-[24px] shadow-sm">
<h2 class="font-bold text-[13px]">Add Real Dish</h2>
<input id="name" placeholder="Name" class="w-full bg-[#F5F1E9] rounded-full px-4 py-3 mt-3 text-sm outline-none">
<input id="price" type="number" placeholder="Price UGX" class="w-full bg-[#F5F1E9] rounded-full px-4 py-3 mt-3 text-sm outline-none">
<select id="cat" class="w-full bg-[#F5F1E9] rounded-full px-4 py-3 mt-3 text-sm outline-none"><option value="Rolex">Rolex</option><option value="Fries">Fries</option><option value="Juice">Juice</option><option value="Soda">Soda</option><option value="Other">Other</option></select>
<input id="desc" placeholder="Description" class="w-full bg-[#F5F1E9] rounded-full px-4 py-3 mt-3 text-sm outline-none">
<input id="file" type="file" accept="image/*" class="mt-3 w-full text-xs">
<button onclick="addDish()" id="ubtn" class="w-full bg-black text-[#D4B67A] py-3.5 mt-4 rounded-full font-bold text-xs tracking-widest">ADD DISH</button>
<p id="dishMsg" class="text-[10px] mt-2 text-black/40"></p>
<div class="mt-5"><p class="font-bold text-[11px] tracking-widest">YOUR MENU (<span id="foodCount">0</span>)</p><div id="foods" class="mt-3 grid grid-cols-2 gap-2"></div></div>
</div>
</div>

<!-- RIGHT: ORDERS -->
<div class="bg-white rounded-[24px] p-5 shadow-sm">
<div class="flex justify-between items-center"><h2 class="font-bold">Orders</h2><button onclick="loadOrders()" class="text-[10px] bg-black text-white px-3 py-1 rounded-full">Refresh</button></div>
<div class="flex gap-2 mt-4 overflow-x-auto pb-2" id="tabs">
<button onclick="setFilter('all')" data-f="all" class="tab-active px-4 py-2 rounded-full text-[11px] font-bold whitespace-nowrap">ALL</button>
<button onclick="setFilter('live')" data-f="live" class="bg-[#F5F1E9] px-4 py-2 rounded-full text-[11px] font-bold whitespace-nowrap">LIVE</button>
<button onclick="setFilter('new')" data-f="new" class="bg-[#F5F1E9] px-4 py-2 rounded-full text-[11px] font-bold whitespace-nowrap">NEW</button>
<button onclick="setFilter('preparing')" data-f="preparing" class="bg-[#F5F1E9] px-4 py-2 rounded-full text-[11px] font-bold whitespace-nowrap">PREPARING</button>
<button onclick="setFilter('on the way')" data-f="on the way" class="bg-[#F5F1E9] px-4 py-2 rounded-full text-[11px] font-bold whitespace-nowrap">ON THE WAY</button>
<button onclick="setFilter('served')" data-f="served" class="bg-[#F5F1E9] px-4 py-2 rounded-full text-[11px] font-bold whitespace-nowrap">COMPLETED</button>
<button onclick="setFilter('canceled')" data-f="canceled" class="bg-[#F5F1E9] px-4 py-2 rounded-full text-[11px] font-bold whitespace-nowrap">CANCELED</button>
</div>
<div id="orders" class="mt-4 space-y-3 max-h-[900px] overflow-auto pr-1"></div>
</div>
</div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyBXOE8w7uZQA4YwXyqz8b8cMoNsp84n7RY",authDomain:"quickbite-kataza.firebaseapp.com",projectId:"quickbite-kataza",storageBucket:"quickbite-kataza.firebasestorage.app",messagingSenderId:"584517077834",appId:"1:584517077834:web:9465cd7f4183561e880fb3"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore(); const storage=firebase.storage();
let allOrders=[], filter='all';
document.getElementById('conn').innerText='Connected to quickbite-kataza';

async function clearFake(){ if(!confirm('Delete all dishes/banners with unsplash images?')) return; let b=await db.collection('banners').get(); for(let d of b.docs){ if((d.data().url||'').includes('unsplash')) await d.ref.delete(); } let p=await db.collection('products').get(); for(let d of p.docs){ if((d.data().image_url||'').includes('unsplash')) await d.ref.delete(); } alert('Fake deleted'); }

async function addBanner(){
 let snap=await db.collection('banners').get(); if(snap.size>=7) return alert('Max 7 reached. Delete one.');
 let file=bannerFile.files[0]; if(!file) return alert('Select image');
 bannerBtn.innerText='Uploading...'; bannerBtn.disabled=true;
 try{ let ref=storage.ref('banners/'+Date.now()+'_'+file.name); await ref.put(file); let url=await ref.getDownloadURL(); await db.collection('banners').add({url,title:bTitle.value,order:snap.size,created_at:firebase.firestore.FieldValue.serverTimestamp()}); bTitle.value=''; bannerFile.value=''; }catch(e){ alert(e.message); } bannerBtn.innerText='ADD BANNER'; bannerBtn.disabled=false;
}
async function addDish(){
 if(!name.value||!price.value||!file.files[0]) return alert('Name, Price, Photo required');
 ubtn.innerText='Uploading...'; ubtn.disabled=true; dishMsg.innerText='Uploading...';
 try{ let ref=storage.ref('foods/'+Date.now()+'_'+file.files[0].name); await ref.put(file.files[0]); let url=await ref.getDownloadURL(); await db.collection('products').add({name:name.value,price:+price.value,category:cat.value,description:desc.value,image_url:url,is_available:true,created_at:firebase.firestore.FieldValue.serverTimestamp()}); dishMsg.innerText='Added!'; name.value=''; price.value=''; desc.value=''; file.value=''; }catch(e){ dishMsg.innerText=e.message; alert(e.message); } ubtn.innerText='ADD DISH'; ubtn.disabled=false;
}

function setFilter(f){ filter=f; document.querySelectorAll('#tabs button').forEach(b=>{ b.className = b.dataset.f===f? 'tab-active px-4 py-2 rounded-full text-[11px] font-bold whitespace-nowrap' : 'bg-[#F5F1E9] px-4 py-2 rounded-full text-[11px] font-bold whitespace-nowrap'; }); renderOrders(); }
function loadOrders(){}

db.collection('banners').orderBy('order').onSnapshot(s=>{ bannerCount.innerText=s.size+'/7'; bannerList.innerHTML=s.docs.map(d=>{let b=d.data(); return `<div class="flex gap-2 items-center bg-white/10 p-2 rounded-xl"><img src="${b.url}" class="w-14 h-10 rounded-lg object-cover"><div class="flex-1"><p class="text-xs truncate">${b.title||'Banner'}</p></div><button onclick="db.collection('banners').doc('${d.id}').delete()" class="bg-red-600 text-white text-[9px] px-2 py-1 rounded-full">DEL</button></div>`}).join(''); });
db.collection('products').onSnapshot(s=>{ foodCount.innerText=s.size; foods.innerHTML=s.docs.map(d=>{let f=d.data(); return `<div class="border rounded-xl overflow-hidden"><img src="${f.image_url}" class="h-20 w-full object-cover"><div class="p-2 text-[10px]"><b>${f.name}</b><br>UGX ${f.price}<br>${f.category}<div class="flex gap-1 mt-1"><button onclick="db.collection('products').doc('${d.id}').delete()" class="bg-red-500 text-white px-2 py-1 rounded-full">Del</button><button onclick="db.collection('products').doc('${d.id}').update({is_available:${!f.is_available}})" class="bg-black text-white px-2 py-1 rounded-full">${f.is_available?'Hide':'Show'}</button></div></div></div>`}).join(''); });

db.collection('orders').orderBy('created_at','desc').limit(100).onSnapshot(s=>{
 allOrders=s.docs.map(d=>({id:d.id,...d.data()}));
 liveCount.innerText = allOrders.filter(o=>['new','preparing','on the way'].includes(o.status)).length;
 doneCount.innerText = allOrders.filter(o=>o.status==='served').length;
 cancelCount.innerText = allOrders.filter(o=>o.status==='canceled').length;
 let today = new Date(); today.setHours(0,0,0,0);
 let sales = allOrders.filter(o=> o.created_at && o.created_at.toDate()>=today && o.status!=='canceled').reduce((a,b)=>a+(b.total||0),0);
 todaySales.innerText = sales.toLocaleString();
 renderOrders();
});

function renderOrders(){
 let list = allOrders;
 if(filter==='live') list = list.filter(o=>['new','preparing','on the way'].includes(o.status));
 else if(filter!=='all') list = list.filter(o=>o.status===filter);
 if(!list.length){ orders.innerHTML='<p class="text-center py-10 text-black/30 text-xs">No '+filter+' orders</p>'; return; }
 orders.innerHTML=list.map(o=>{
  let color = o.status==='new'?'border-red-500':o.status==='preparing'?'border-orange-400':o.status==='on the way'?'border-blue-500':o.status==='served'?'border-green-500':o.status==='canceled'?'border-gray-300':'border-black';
  return `<div class="border-l-4 ${color} bg-[#F5F1E9] p-3 rounded-r-[16px]">
   <div class="flex justify-between"><b class="text-xs">${o.customer_name} • ${o.customer_phone}</b><span class="text-[10px] font-bold uppercase px-2 py-1 bg-white rounded-full">${o.status}</span></div>
   <p class="text-[11px] mt-1">${o.area||''} ${o.delivery_fee?'(Fee '+o.delivery_fee+')':''} • ${o.location||''}</p>
   <p class="text-[11px] mt-1 font-bold">${(o.items||[]).map(i=>i.name+' x'+i.qty).join(', ')}</p>
   ${o.note?`<p class="text-[10px] mt-1 italic bg-white p-2 rounded-lg">Note: ${o.note}</p>`:''}
   <p class="text-xs font-bold mt-2">UGX ${(o.total||0).toLocaleString()} (Sub ${(o.subtotal||0).toLocaleString()} + Del ${o.delivery_fee||0})</p>
   <div class="flex flex-wrap gap-2 mt-3">
    <button onclick="db.collection('orders').doc('${o.id}').update({status:'preparing'})" class="bg-orange-500 text-white px-3 py-1.5 rounded-full text-[10px]">Preparing</button>
    <button onclick="db.collection('orders').doc('${o.id}').update({status:'on the way'})" class="bg-blue-600 text-white px-3 py-1.5 rounded-full text-[10px]">On Way</button>
    <button onclick="db.collection('orders').doc('${o.id}').update({status:'served'})" class="bg-green-600 text-white px-3 py-1.5 rounded-full text-[10px]">Completed</button>
    <button onclick="db.collection('orders').doc('${o.id}').update({status:'canceled'})" class="bg-black text-white px-3 py-1.5 rounded-full text-[10px]">Cancel</button>
    <button onclick="if(confirm('Delete order permanently?')) db.collection('orders').doc('${o.id}').delete()" class="bg-red-600 text-white px-3 py-1.5 rounded-full text-[10px]">Delete</button>
   </div>
   <p class="text-[9px] text-black/30 mt-2">${o.created_at?o.created_at.toDate().toLocaleString():''} • ID ${o.id.slice(0,6).toUpperCase()}</p>
  </div>`;
 }).join('');
}
</script>
</body>
</html>
