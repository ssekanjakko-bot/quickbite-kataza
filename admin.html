<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script></head><body class="bg-[#FAF6F0] p-6"><div class="max-w-5xl mx-auto"><h1 class="font-black text-xl">Quick Bite Admin - Firebase</h1><div class="mt-4 grid md:grid-cols-3 gap-4"><div class="bg-white p-4 rounded-xl">Sales <b id="sales">0</b></div><div class="bg-white p-4 rounded-xl">Orders <b id="oc">0</b></div><div class="bg-white p-4 rounded-xl">Live <b class="text-green-600">●</b></div></div><div class="mt-6 bg-white p-4 rounded-xl max-w-md"><input id="name" placeholder="Name" class="w-full border p-2 mt-2"><input id="price" type="number" placeholder="Price UGX" class="w-full border p-2 mt-2"><input id="cat" placeholder="Category" class="w-full border p-2 mt-2"><input id="desc" placeholder="Story" class="w-full border p-2 mt-2"><input id="file" type="file" class="mt-2"><button onclick="add()" id="ubtn" class="w-full bg-black text-[#C6A86A] py-3 mt-3 rounded-full font-bold">Upload Dish</button></div><h2 class="mt-8 font-bold">Live Orders (with TIME)</h2><div id="orders" class="mt-3 space-y-2"></div><h2 class="mt-8 font-bold">Menu</h2><div id="foods" class="mt-3 grid md:grid-cols-4 gap-3"></div></div><script>const firebaseConfig = { apiKey: "YOUR_KEY", authDomain: "YOUR_DOMAIN", projectId: "YOUR_PROJECT_ID", storageBucket: "YOUR_BUCKET", appId: "YOUR_APP_ID" };firebase.initializeApp(firebaseConfig);const db=firebase.firestore();async function add(){ubtn.innerText='Uploading...';let file=document.getElementById('file').files[0],url='';if(file){let ref=firebase.storage().ref('foods/'+Date.now()+'_'+file.name);await ref.put(file);url=await ref.getDownloadURL();}await db.collection('products').add({name:name.value,price:+price.value,category:cat.value,description:desc.value,image_url:url,is_available:true,created_at:firebase.firestore.FieldValue.serverTimestamp()});ubtn.innerText='Upload Dish';alert('Added');}db.collection('products').onSnapshot(s=>{foods.innerHTML=s.docs.map(d=>{let f=d.data();return `<div class="bg-white rounded-xl overflow-hidden"><img src="${f.image_url}" class="h-24 w-full object-cover"><div class="p-2 text-xs">${f.name} - ${f.price}<button onclick="db.collection('products').doc('${d.id}').delete()" class="text-red-500 ml-2">Del</button></div></div>`}).join('');});db.collection('orders').orderBy('created_at','desc').onSnapshot(s=>{oc.innerText=s.size;let total=0;s.forEach(d=>total+=d.data().total||0);sales.innerText='UGX '+total.toLocaleString();orders.innerHTML=s.docs.map(d=>{let o=d.data(),time=o.created_at?o.created_at.toDate().toLocaleString():'now';return `<div class="bg-white p-3 rounded-xl flex justify-between border-l-4 border-black"><div><b>${o.customer_name} - ${o.customer_phone}</b> • ${o.location}<br><span class="text-[11px] text-gray-500">${time}</span><br><span class="text-xs">${o.items.map(i=>i.name+' x'+i.qty).join(', ')}</span></div><div class="text-right"><b class="text-[#C6A86A]">UGX ${o.total}</b><br><select onchange="db.collection('orders').doc('${d.id}').update({status:this.value})" class="text-xs border mt-1"><option selected>${o.status}</option><option>preparing</option><option>served</option></select></div></div>`}).join('');});</script></body></html>
