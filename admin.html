<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin REAL Fixed</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script></head><body class="bg-[#F5F1E9] p-4"><div class="max-w-7xl mx-auto">
<h1 class="text-2xl font-bold">Quick Bite Admin REAL</h1>

<div class="grid lg:grid-cols-[380px_1fr] gap-6 mt-6">
<div class="space-y-6">
<div class="bg-[#0A0A0A] text-white p-5 rounded-[24px]"><h2 class="text-[#D4B67A] text-[11px] tracking-[3px] font-bold">BANNERS MAX 7</h2><p id="bannerCount" class="text-white/40 text-[11px]">0/7</p><input id="bTitle" placeholder="Banner Title" class="w-full bg-white/10 rounded-full px-4 py-3 text-xs mt-4 outline-none"><input id="bannerFile" type="file" accept="image/*" class="mt-3 w-full text-xs"><button onclick="addBanner()" id="bannerBtn" class="w-full mt-3 bg-[#D4B67A] text-black py-3 rounded-full text-xs font-bold">ADD BANNER</button><div id="bannerList" class="mt-4 space-y-2"></div></div>

<div class="bg-white p-5 rounded-[24px] shadow-sm">
<h2 class="font-bold text-[13px]">Add Real Dish</h2>
<input id="dishName" placeholder="Name e.g Rolex" class="w-full bg-[#F5F1E9] rounded-full px-4 py-3 mt-3 text-sm outline-none">
<input id="dishPrice" type="number" placeholder="Price UGX e.g 2500" class="w-full bg-[#F5F1E9] rounded-full px-4 py-3 mt-3 text-sm outline-none">
<select id="dishCat" class="w-full bg-[#F5F1E9] rounded-full px-4 py-3 mt-3 text-sm outline-none"><option>Rolex</option><option>Fries</option><option>Juice</option><option>Soda</option><option>Other</option></select>
<input id="dishDesc" placeholder="Description e.g Eggs" class="w-full bg-[#F5F1E9] rounded-full px-4 py-3 mt-3 text-sm outline-none">
<input id="dishFile" type="file" accept="image/*" class="mt-4 w-full text-xs">
<button onclick="addDish()" id="ubtn" class="w-full bg-black text-[#D4B67A] py-3.5 mt-4 rounded-full font-bold text-xs">ADD DISH</button>
<p id="dishMsg" class="text-[10px] mt-2"></p>
<div class="mt-5"><p class="font-bold text-[11px]">YOUR MENU (<span id="foodCount">0</span>)</p><div id="foods" class="mt-3 grid grid-cols-2 gap-2"></div></div>
</div>
</div>

<div class="bg-white rounded-[24px] p-5"><h2 class="font-bold">Orders</h2>
<div class="flex gap-2 mt-4 overflow-x-auto" id="tabs">
<button onclick="setFilter('all')" data-f="all" class="tab-active bg-black text-[#D4B67A] px-4 py-2 rounded-full text-[11px] font-bold">ALL</button>
<button onclick="setFilter('live')" data-f="live" class="bg-[#F5F1E9] px-4 py-2 rounded-full text-[11px] font-bold">LIVE</button>
<button onclick="setFilter('new')" data-f="new" class="bg-[#F5F1E9] px-4 py-2 rounded-full text-[11px] font-bold">NEW</button>
<button onclick="setFilter('preparing')" data-f="preparing" class="bg-[#F5F1E9] px-4 py-2 rounded-full text-[11px] font-bold">PREPARING</button>
<button onclick="setFilter('served')" data-f="served" class="bg-[#F5F1E9] px-4 py-2 rounded-full text-[11px] font-bold">COMPLETED</button>
<button onclick="setFilter('canceled')" data-f="canceled" class="bg-[#F5F1E9] px-4 py-2 rounded-full text-[11px] font-bold">CANCELED</button>
</div><div id="orders" class="mt-4 space-y-3"></div></div>
</div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyBXOE8w7uZQA4YwXyqz8b8cMoNsp84n7RY",authDomain:"quickbite-kataza.firebaseapp.com",projectId:"quickbite-kataza",storageBucket:"quickbite-kataza.firebasestorage.app",messagingSenderId:"584517077834",appId:"1:584517077834:web:9465cd7f4183561e880fb3"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();const storage=firebase.storage();
let allOrders=[], filter='all';

async function addBanner(){ let snap=await db.collection('banners').get(); if(snap.size>=7) return alert('Max 7'); let f=document.getElementById('bannerFile').files[0]; if(!f) return alert('Select image'); bannerBtn.innerText='Uploading...'; let ref=storage.ref('banners/'+Date.now()+'_'+f.name); await ref.put(f); let url=await ref.getDownloadURL(); await db.collection('banners').add({url,title:bTitle.value,order:snap.size,created_at:firebase.firestore.FieldValue.serverTimestamp()}); bannerBtn.innerText='ADD BANNER'; }

async function addDish(){
 let n=document.getElementById('dishName').value.trim();
 let p=document.getElementById('dishPrice').value.trim();
 let c=document.getElementById('dishCat').value;
 let d=document.getElementById('dishDesc').value.trim();
 let fileInput=document.getElementById('dishFile');
 let f=fileInput.files[0];
 console.log({n,p,f});
 if(!n||!p||!f){ alert('Name, Price, Photo required - Name:'+n+' Price:'+p+' File:'+(f?f.name:'none')); return; }
 ubtn.innerText='Uploading...'; ubtn.disabled=true; dishMsg.innerText='Uploading to Firebase...';
 try{ let ref=storage.ref('foods/'+Date.now()+'_'+f.name); await ref.put(f); let url=await ref.getDownloadURL(); await db.collection('products').add({name:n,price:+p,category:c,description:d,image_url:url,is_available:true,created_at:firebase.firestore.FieldValue.serverTimestamp()}); dishMsg.innerText='Added!'; document.getElementById('dishName').value=''; document.getElementById('dishPrice').value=''; fileInput.value=''; }catch(e){ alert('Upload failed: '+e.message); dishMsg.innerText=e.message; } ubtn.innerText='ADD DISH'; ubtn.disabled=false;
}

function setFilter(f){ filter=f; document.querySelectorAll('#tabs button').forEach(b=> b.className = b.dataset.f===f?'bg-black text-[#D4B67A] px-4 py-2 rounded-full text-[11px] font-bold':'bg-[#F5F1E9] px-4 py-2 rounded-full text-[11px] font-bold'); renderOrders(); }

db.collection('banners').orderBy('order').onSnapshot(s=>{ bannerCount.innerText=s.size+'/7'; bannerList.innerHTML=s.docs.map(doc=>`<div class="flex gap-2 items-center bg-white/10 p-2 rounded-xl"><img src="${doc.data().url}" class="w-14 h-10 rounded-lg object-cover"><button onclick="db.collection('banners').doc('${doc.id}').delete()" class="bg-red-600 text-white text-[9px] px-2 py-1 rounded-full">DEL</button></div>`).join(''); });
db.collection('products').onSnapshot(s=>{ foodCount.innerText=s.size; foods.innerHTML=s.docs.map(doc=>{let f=doc.data(); return `<div class="border rounded-xl overflow-hidden"><img src="${f.image_url}" class="h-20 w-full object-cover"><div class="p-2 text-[10px]"><b>${f.name}</b><br>UGX ${f.price}<br><button onclick="db.collection('products').doc('${doc.id}').delete()" class="bg-red-500 text-white px-2 py-1 rounded-full mt-1">Del</button></div></div>`}).join(''); });
db.collection('orders').orderBy('created_at','desc').limit(100).onSnapshot(s=>{ allOrders=s.docs.map(d=>({id:d.id,...d.data()})); renderOrders(); });
function renderOrders(){
 let list=allOrders; if(filter==='live') list=list.filter(o=>['new','preparing','on the way'].includes(o.status)); else if(filter!=='all') list=list.filter(o=>o.status===filter);
 if(!list.length){ orders.innerHTML='<p class="text-center py-10 text-black/30 text-xs">No '+filter+' orders</p>'; return; }
 orders.innerHTML=list.map(o=>`<div class="bg-[#F5F1E9] p-3 rounded-xl border-l-4 ${o.status==='new'?'border-red-500':o.status==='canceled'?'border-gray-400':'border-green-500'}"><div class="flex justify-between"><b class="text-xs">${o.customer_name||'No name'} ${o.customer_phone||''}</b><span class="text-[10px] bg-white px-2 py-1 rounded-full">${o.status}</span></div><p class="text-[11px]">${o.area||''} ${o.location||''}</p><p class="text-[11px] font-bold">${(o.items||[]).map(i=>i.name+' x'+i.qty).join(', ')}</p><p class="text-xs font-bold mt-1">UGX ${(o.total||0).toLocaleString()}</p><div class="flex gap-2 mt-2 flex-wrap"><button onclick="db.collection('orders').doc('${o.id}').update({status:'preparing'})" class="bg-orange-500 text-white px-3 py-1 rounded-full text-[10px]">Preparing</button><button onclick="db.collection('orders').doc('${o.id}').update({status:'on the way'})" class="bg-blue-600 text-white px-3 py-1 rounded-full text-[10px]">On Way</button><button onclick="db.collection('orders').doc('${o.id}').update({status:'served'})" class="bg-green-600 text-white px-3 py-1 rounded-full text-[10px]">Done</button><button onclick="db.collection('orders').doc('${o.id}').update({status:'canceled'})" class="bg-black text-white px-3 py-1 rounded-full text-[10px]">Cancel</button></div></div>`).join('');
}
</script></body></html>
