<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Bite REAL Admin</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script></head><body class="bg-[#F5F1E9] p-4"><div class="max-w-6xl mx-auto">
<h1 class="text-[28px] font-bold">Quick Bite REAL</h1><button onclick="clearFakeData()" class="bg-red-600 text-white text-[10px] px-3 py-1 rounded-full mt-2">DELETE ALL FAKE DATA</button>

<!-- REAL BANNER -->
<div class="bg-black text-white p-6 rounded-[24px] mt-6">
<h2 class="text-[#D4B67A] text-[12px] tracking-[3px] font-bold">REAL HERO BANNERS - Take photo of your food / shop</h2><p id="bannerCount" class="text-white/50 text-[11px] mt-1">0/7</p>
<input id="bTitle" placeholder="Real Title: e.g TODAY'S SPECIAL" class="w-full bg-white/10 rounded-full px-4 py-3 text-xs mt-3 outline-none">
<input id="bannerFile" type="file" accept="image/*" capture="environment" class="mt-3 text-xs">
<button onclick="addBanner()" id="bannerBtn" class="mt-3 bg-[#D4B67A] text-black px-6 py-3 rounded-full text-xs font-bold w-full">UPLOAD REAL BANNER</button>
<div id="bannerList" class="mt-4 grid grid-cols-2 md:grid-cols-3 gap-2"></div>
</div>

<!-- REAL MENU -->
<div class="bg-white p-6 rounded-[24px] mt-6 shadow-sm">
<h2 class="font-bold">Add REAL Dish - Use Your Phone Camera</h2>
<input id="name" placeholder="Real Name: e.g Rolex 2 eggs" class="w-full bg-[#F5F1E9] rounded-full px-4 py-3 mt-3 text-sm outline-none">
<input id="price" type="number" placeholder="Real Price UGX" class="w-full bg-[#F5F1E9] rounded-full px-4 py-3 mt-3 text-sm outline-none">
<select id="cat" class="w-full bg-[#F5F1E9] rounded-full px-4 py-3 mt-3 text-sm outline-none"><option>Rolex</option><option>Fries</option><option>Juice</option><option>Soda</option></select>
<input id="desc" placeholder="Real description" class="w-full bg-[#F5F1E9] rounded-full px-4 py-3 mt-3 text-sm outline-none">
<input id="file" type="file" accept="image/*" capture="environment" class="mt-4 w-full text-xs">
<button onclick="addRealDish()" id="ubtn" class="w-full bg-black text-[#D4B67A] py-4 mt-4 rounded-full font-bold text-xs">ADD REAL DISH</button>
</div>

<div class="mt-6 grid md:grid-cols-2 gap-4">
<div><h3 class="font-bold">Your Real Menu (<span id="foodCount">0</span>)</h3><div id="foods" class="mt-3 grid grid-cols-2 gap-2"></div></div>
<div><h3 class="font-bold">Live Orders</h3><div id="orders" class="mt-3 space-y-2"></div></div>
</div>
</div><script>
const firebaseConfig={apiKey:"AIzaSyBXOE8w7uZQA4YwXyqz8b8cMoNsp84n7RY",authDomain:"quickbite-kataza.firebaseapp.com",projectId:"quickbite-kataza",storageBucket:"quickbite-kataza.firebasestorage.app",messagingSenderId:"584517077834",appId:"1:584517077834:web:9465cd7f4183561e880fb3"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();const storage=firebase.storage();

async function clearFakeData(){ if(!confirm('Delete ALL banners and products with Unsplash?')) return; let b=await db.collection('banners').get(); for(let d of b.docs){ if(d.data().url.includes('unsplash')) await d.ref.delete(); } let p=await db.collection('products').get(); for(let d of p.docs){ if((d.data().image_url||'').includes('unsplash')) await d.ref.delete(); } alert('Fake data deleted. Now add real photos.'); }

async function addBanner(){ let s=await db.collection('banners').get(); if(s.size>=7) return alert('Max 7'); let file=bannerFile.files[0]; if(!file) return alert('Take photo'); bannerBtn.innerText='Uploading...'; let ref=storage.ref('real_banners/'+Date.now()+'.jpg'); await ref.put(file); let url=await ref.getDownloadURL(); await db.collection('banners').add({url,title:bTitle.value,order:s.size,created_at:firebase.firestore.FieldValue.serverTimestamp()}); bannerBtn.innerText='UPLOAD REAL BANNER'; bTitle.value=''; }
async function addRealDish(){ if(!name.value||!price.value||!file.files[0]) return alert('Name, Price, Photo required'); ubtn.innerText='Uploading...'; let ref=storage.ref('real_foods/'+Date.now()+'.jpg'); await ref.put(file.files[0]); let url=await ref.getDownloadURL(); await db.collection('products').add({name:name.value,price:+price.value,category:cat.value,description:desc.value,image_url:url,is_available:true,created_at:firebase.firestore.FieldValue.serverTimestamp()}); ubtn.innerText='ADD REAL DISH'; alert('Real dish added'); }

db.collection('banners').orderBy('order').onSnapshot(s=>{ bannerCount.innerText=s.size+'/7'; bannerList.innerHTML=s.docs.map(d=>`<div class="relative"><img src="${d.data().url}" class="w-full h-24 object-cover rounded-xl"><button onclick="db.collection('banners').doc('${d.id}').delete()" class="absolute top-1 right-1 bg-red-600 text-white text-[8px] px-2 py-1 rounded-full">X</button></div>`).join(''); });
db.collection('products').onSnapshot(s=>{ foodCount.innerText=s.size; foods.innerHTML=s.docs.map(d=>{let f=d.data(); return `<div class="bg-white rounded-xl overflow-hidden"><img src="${f.image_url}" class="h-24 w-full object-cover"><div class="p-2 text-[11px]"><b>${f.name}</b><br>UGX ${f.price}<br><button onclick="db.collection('products').doc('${d.id}').delete()" class="text-red-500">Delete</button></div></div>`}).join(''); });
db.collection('orders').orderBy('created_at','desc').limit(20).onSnapshot(s=>{ orders.innerHTML=s.docs.map(d=>{let o=d.data(); return `<div class="bg-white p-3 rounded-xl text-xs"><b>${o.customer_name} ${o.area}</b> UGX ${o.total}<br>${(o.items||[]).map(i=>i.name).join(', ')}<br><select onchange="db.collection('orders').doc('${d.id}').update({status:this.value})"><option>${o.status}</option><option>preparing</option><option>served</option></select></div>`}).join(''); });
</script></body></html>
