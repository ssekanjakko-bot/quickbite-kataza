<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Quick Bite Kataza - Real</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Instrument+Sans:wght@400;500;700&display=swap" rel="stylesheet"><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script><style>body{font-family:'Instrument Sans',sans-serif;background:#F5F1E9}.serif{font-family:'Cormorant Garamond',serif}.scrollbar-hide::-webkit-scrollbar{display:none}.carousel{scroll-snap-type:x mandatory;scroll-behavior:smooth}.slide{scroll-snap-align:start;flex:0 0 100%}</style></head><body><div class="max-w-[430px] mx-auto bg-[#F5F1E9] min-h-screen relative shadow-2xl">

<!-- HERO -->
<div class="relative h-[380px] overflow-hidden bg-black rounded-b-[36px]">
<div id="bannerTrack" class="flex w-full h-full overflow-x-auto carousel scrollbar-hide"></div>
<div id="dots" class="absolute bottom-[72px] left-7 flex gap-2 z-10"></div>
<div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/20 to-black/10 pointer-events-none rounded-b-[36px]"></div>
<div class="absolute bottom-0 left-0 right-0 p-7 z-10"><p class="text-[#D4B67A] text-[10px] tracking-[4px] font-bold">KATAZA • REAL FOOD • FAST</p><h1 class="serif text-[#F5F1E9] text-[44px] leading-[0.85] mt-3 font-bold">Quick Bite<br><span class="text-[#D4B67A] italic font-normal">Kataza</span></h1><p class="text-white/60 text-[11px] mt-3">Delivery in 20min • Kataza / Kiswa / Mbuya</p></div>
</div>

<div class="sticky top-0 bg-[#F5F1E9]/90 backdrop-blur-md z-20 px-5 py-4 -mt-2"><div id="cats" class="flex gap-2 overflow-x-auto scrollbar-hide"></div></div>
<div id="menu" class="px-5 pb-32 space-y-5 mt-2"></div>

<div id="cartBtn" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-[400px] bg-[#0A0A0A] rounded-full p-2 pl-6 pr-2 flex justify-between items-center shadow-[0_20px_40px_rgba(0,0,0,0.3)] z-30"><div class="flex items-center gap-3"><div class="w-11 h-11 bg-[#D4B67A] rounded-full flex items-center justify-center text-black font-bold text-sm" id="cartCount">0</div><div><p class="text-white text-[12px] font-bold" id="cartText">0 dishes</p><p class="text-[#D4B67A] text-[11px]" id="cartPrice">UGX 0</p></div></div><button onclick="openCart()" class="bg-white text-black px-7 py-3.5 rounded-full text-[11px] font-bold tracking-widest">CART →</button></div>

<!-- CART PAGE -->
<div id="cartPage" class="hidden fixed inset-0 bg-[#F5F1E9] z-[60] overflow-y-auto"><div class="max-w-[430px] mx-auto p-6"><div class="flex justify-between items-center"><button onclick="closeCart()" class="w-10 h-10 bg-white rounded-full font-bold">✕</button><p class="serif text-[22px] font-bold">Your Order</p><div class="w-10"></div></div><div id="cartList" class="mt-8 space-y-3"></div><div class="mt-6 bg-white rounded-[24px] p-5 shadow-sm"><input id="cname" placeholder="Full name" class="w-full bg-[#F5F1E9] rounded-full px-5 py-4 text-[13px] outline-none"><input id="cphone" placeholder="07XX XXX XXX" class="w-full bg-[#F5F1E9] rounded-full px-5 py-4 text-[13px] outline-none mt-3"><select id="cloc" onchange="updateDelivery()" class="w-full bg-[#F5F1E9] rounded-full px-5 py-4 text-[13px] outline-none mt-3"><option value="">Select delivery area</option><option value="Kataza">Kataza — UGX 500</option><option value="Kiswa">Kiswa — UGX 1,000</option><option value="Mbuya">Mbuya — UGX 2,000</option><option value="Kinawataka">Kinawataka — UGX 2,000</option><option value="Mutungo">Mutungo — UGX 2,500</option><option value="Luzira">Luzira — UGX 3,000</option><option value="Town">Town — UGX 3,000</option></select><input id="clocDetail" placeholder="Hostel / Room / Table No." class="w-full bg-[#F5F1E9] rounded-full px-5 py-4 text-[13px] outline-none mt-3"><textarea id="note" placeholder="Note: e.g No onions" class="w-full bg-[#F5F1E9] rounded-[20px] px-5 py-4 text-[13px] outline-none mt-3 h-20"></textarea></div><div class="mt-6 px-2 space-y-2 text-[13px]"><div class="flex justify-between text-black/50"><span>Subtotal</span><span id="sub">UGX 0</span></div><div class="flex justify-between text-black/50"><span>Delivery (<span id="areaName">Kataza</span>)</span><span id="deliveryLabel">UGX 500</span></div><div class="flex justify-between font-bold text-[16px] pt-3 border-t border-black/10"><span>Total</span><span id="total">UGX 0</span></div></div><button onclick="placeOrder()" id="orderBtn" class="w-full mt-6 bg-[#0A0A0A] text-[#D4B67A] py-5 rounded-full font-bold tracking-[3px] text-[12px]">CONFIRM ORDER</button><p class="text-center text-[11px] mt-4 text-black/40">After order you can <a href="track.html" class="underline font-bold">track here</a></p></div></div>

</div><script>
const firebaseConfig={apiKey:"AIzaSyBXOE8w7uZQA4YwXyqz8b8cMoNsp84n7RY",authDomain:"quickbite-kataza.firebaseapp.com",projectId:"quickbite-kataza",storageBucket:"quickbite-kataza.firebasestorage.app",messagingSenderId:"584517077834",appId:"1:584517077834:web:9465cd7f4183561e880fb3"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
const deliveryFees={Kataza:500,Kiswa:1000,Mbuya:2000,Kinawataka:2000,Mutungo:2500,Luzira:3000,Town:3000};let currentDelivery=500,foods=[],cart=[],activeCat='All',bannerIdx=0,banners=[],autoTimer;

db.collection('banners').orderBy('order').limit(7).onSnapshot(snap=>{
 let track=document.getElementById('bannerTrack');
 if(snap.empty){ track.innerHTML=`<div class="slide h-full bg-[#111] flex items-center justify-center"><p class="text-white/30 text-[11px]">Banners coming soon</p></div>`; dots.innerHTML=''; return; }
 banners=snap.docs.map(d=>({id:d.id,...d.data()}));
 track.innerHTML=banners.map(b=>`<div class="slide h-full relative shrink-0"><img src="${b.url}" class="w-full h-full object-cover"><div class="absolute bottom-20 left-7 right-7"><p class="text-[#D4B67A] text-[11px] tracking-[3px] font-bold">${b.title||''}</p></div></div>`).join('');
 dots.innerHTML=banners.map((_,i)=>`<div class="h-1.5 rounded-full transition-all ${i==bannerIdx?'bg-[#D4B67A] w-6':'bg-white/40 w-1.5'}"></div>`).join('');
 startAuto();
});
function startAuto(){ clearInterval(autoTimer); if(banners.length<=1) return; autoTimer=setInterval(()=>{ let el=document.getElementById('bannerTrack'); bannerIdx=(bannerIdx+1)%banners.length; el.scrollTo({left:bannerIdx*el.clientWidth,behavior:'smooth'}); let ds=document.getElementById('dots'); if(ds) ds.innerHTML=banners.map((_,i)=>`<div class="h-1.5 rounded-full transition-all ${i==bannerIdx?'bg-[#D4B67A] w-6':'bg-white/40 w-1.5'}"></div>`).join(''); },4000); }

db.collection('products').onSnapshot(snap=>{
 let el=document.getElementById('menu');
 if(snap.empty){ el.innerHTML=`<div class="py-24 text-center"><p class="serif text-[20px] font-bold">Menu coming soon</p><p class="text-[12px] text-black/40 mt-2">Admin is adding real dishes</p></div>`; cats.innerHTML=''; return; }
 foods=snap.docs.map(d=>({id:d.id,...d.data()})).filter(f=>f.is_available!==false);
 renderCats();render();
});

function renderCats(){ let catsList=['All',...new Set(foods.map(f=>f.category).filter(Boolean))]; document.getElementById('cats').innerHTML=catsList.map(c=>`<button onclick="setCat('${c}')" class="whitespace-nowrap px-5 py-2.5 rounded-full text-[11px] font-bold tracking-widest ${activeCat==c?'bg-[#0A0A0A] text-[#D4B67A]':'bg-white text-black/60 border border-black/5'}">${c.toUpperCase()}</button>`).join(''); }
function setCat(c){activeCat=c;renderCats();render();}
function render(){ let list=activeCat=='All'?foods:foods.filter(f=>f.category==activeCat); document.getElementById('menu').innerHTML=list.map(f=>`<div class="bg-white rounded-[32px] overflow-hidden shadow-[0_8px_24px_rgba(0,0,0,0.04)]"><img src="${f.image_url}" class="w-full h-[210px] object-cover"><div class="p-6"><div class="flex justify-between items-start gap-3"><div><h3 class="serif text-[20px] font-bold leading-[1]">${f.name}</h3><p class="text-[11px] text-black/50 mt-2 leading-[1.4]">${f.description||''}</p><p class="text-[11px] mt-2 font-bold tracking-widest text-black/40">${(f.category||'').toUpperCase()}</p></div><button onclick="add('${f.id}')" class="w-11 h-11 bg-[#0A0A0A] text-[#D4B67A] rounded-full text-[20px] shrink-0">+</button></div><div class="mt-4 text-[15px] font-bold">UGX ${Number(f.price).toLocaleString()}</div></div></div>`).join(''); }

function add(id){let f=foods.find(x=>x.id==id);let e=cart.find(x=>x.id==id);if(e)e.qty++;else cart.push({...f,qty:1});updateBtn();}
function updateBtn(){let c=cart.reduce((a,b)=>a+b.qty,0),t=cart.reduce((a,b)=>a+b.price*b.qty,0);let btn=document.getElementById('cartBtn');if(c>0){btn.classList.remove('hidden');cartCount.innerText=c;cartText.innerText=c+' dish'+(c>1?'es':'');cartPrice.innerText='UGX '+t.toLocaleString();}else btn.classList.add('hidden');}
function openCart(){document.getElementById('cartPage').classList.remove('hidden');updateDelivery();}
function closeCart(){document.getElementById('cartPage').classList.add('hidden');}
function updateDelivery(){let area=cloc.value||'Kataza';currentDelivery=deliveryFees[area]||500;areaName.innerText=area;deliveryLabel.innerText='UGX '+currentDelivery.toLocaleString();let t=cart.reduce((a,b)=>a+b.price*b.qty,0);cartList.innerHTML=cart.map(f=>`<div class="bg-white rounded-[20px] p-4 flex gap-4 items-center"><img src="${f.image_url}" class="w-16 h-16 rounded-[14px] object-cover"><div class="flex-1"><p class="font-bold text-[13px]">${f.name}</p><p class="text-[11px] text-black/50">UGX ${f.price} x ${f.qty}</p></div><div class="text-right"><p class="font-bold text-[13px]">UGX ${(f.price*f.qty).toLocaleString()}</p><button onclick="removeCart('${f.id}')" class="text-[10px] text-red-500">Remove</button></div></div>`).join('');sub.innerText='UGX '+t.toLocaleString();total.innerText='UGX '+(t+currentDelivery).toLocaleString();}
function removeCart(id){cart=cart.filter(c=>c.id!=id);updateBtn();updateDelivery();}
async function placeOrder(){if(!cloc.value)return alert('Select delivery area');if(!cname.value||!cphone.value)return alert('Enter name & phone');if(!cart.length)return alert('Cart empty');orderBtn.innerText='PLACING...';orderBtn.disabled=true;let subtotal=cart.reduce((a,b)=>a+b.price*b.qty,0);let docRef=await db.collection('orders').add({customer_name:cname.value,customer_phone:cphone.value,area:cloc.value,location:cloc.value+' - '+clocDetail.value,delivery_fee:currentDelivery,subtotal,total:subtotal+currentDelivery,items:cart.map(i=>({name:i.name,price:i.price,qty:i.qty})),note:note.value,status:'new',created_at:firebase.firestore.FieldValue.serverTimestamp()});localStorage.setItem('lastOrderId',docRef.id);alert('Order placed! ID: '+docRef.id.slice(0,6).toUpperCase());cart=[];updateBtn();closeCart();orderBtn.innerText='CONFIRM ORDER';orderBtn.disabled=false;window.location.href='track.html?id='+docRef.id;}
</script></body></html>
