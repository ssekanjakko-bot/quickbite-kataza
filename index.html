<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Quick Bite Kataza</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Instrument+Sans:wght@400;500;700&display=swap" rel="stylesheet"><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script><style>body{font-family:'Instrument Sans',sans-serif;background:#F5F1E9}.serif{font-family:'Cormorant Garamond',serif}.scrollbar-hide::-webkit-scrollbar{display:none}.carousel{scroll-snap-type:x mandatory;scroll-behavior:smooth}.slide{scroll-snap-align:start;flex:0 0 100%}</style></head><body><div class="max-w-[430px] mx-auto bg-[#F5F1E9] min-h-screen relative shadow-2xl pb-[90px]">

<!-- HERO SMALLER -->
<div class="relative h-[300px] overflow-hidden bg-black rounded-b-[28px]">
<div id="bannerTrack" class="flex w-full h-full overflow-x-auto carousel scrollbar-hide"></div>
<div id="dots" class="absolute bottom-[20px] left-1/2 -translate-x-1/2 flex gap-1.5 z-10"></div>
<div class="absolute inset-0 bg-gradient-to-t from-black/90 to-black/10 pointer-events-none"></div>
<div class="absolute bottom-0 left-0 right-0 p-5 z-10"><p class="text-[#D4B67A] text-[9px] tracking-[3px] font-bold">KATAZA • REAL FOOD • FAST</p><h1 class="serif text-white text-[32px] leading-[0.9] mt-1 font-bold">Quick Bite <span class="text-[#D4B67A] italic">Kataza</span></h1></div>
</div>

<!-- CATS -->
<div class="sticky top-0 bg-[#F5F1E9]/95 backdrop-blur-md z-20 px-4 py-3"><div id="cats" class="flex gap-2 overflow-x-auto scrollbar-hide"></div></div>

<!-- COMPACT GRID - 2 columns small cards -->
<div id="menu" class="px-3 grid grid-cols-2 gap-3 mt-1"></div>

<!-- BOTTOM NAV -->
<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] bg-white/95 backdrop-blur-md border-t border-black/5 px-2 py-2 flex justify-around items-center z-40 rounded-t-[24px] shadow-[0_-10px_30px_rgba(0,0,0,0.06)]">
<button class="flex flex-col items-center gap-1 px-5 py-1.5 rounded-full bg-[#0A0A0A] text-[#D4B67A]"><span class="text-[16px]">⌂</span><span class="text-[9px] font-bold tracking-widest">HOME</span></button>
<button onclick="document.getElementById('cats').scrollIntoView({behavior:'smooth'})" class="flex flex-col items-center gap-1 px-4 py-1.5"><span class="text-[16px]">☰</span><span class="text-[9px] font-bold">MENU</span></button>
<button onclick="openCart()" class="flex flex-col items-center gap-1 px-4 py-1.5 relative"><span class="text-[16px]">🛒</span><span class="text-[9px] font-bold">CART</span><span id="navBadge" class="hidden absolute -top-1 right-1 bg-[#D4B67A] text-black text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span></button>
<a href="track.html" class="flex flex-col items-center gap-1 px-4 py-1.5"><span class="text-[16px]">◍</span><span class="text-[9px] font-bold">TRACK</span></a>
</div>

<!-- FLOAT CART -->
<div id="cartBtn" class="hidden fixed bottom-[88px] left-1/2 -translate-x-1/2 w-[90%] max-w-[380px] bg-[#0A0A0A] rounded-full p-2 pl-5 pr-2 flex justify-between items-center shadow-xl z-30"><div class="flex items-center gap-3"><div class="w-9 h-9 bg-[#D4B67A] rounded-full flex items-center justify-center text-black font-bold text-xs" id="cartCount">0</div><div><p class="text-white text-[11px] font-bold" id="cartText">0 dishes</p><p class="text-[#D4B67A] text-[10px]" id="cartPrice">UGX 0</p></div></div><button onclick="openCart()" class="bg-white text-black px-6 py-2.5 rounded-full text-[10px] font-bold">VIEW →</button></div>

<!-- CART PAGE -->
<div id="cartPage" class="hidden fixed inset-0 bg-[#F5F1E9] z-[60] overflow-y-auto"><div class="max-w-[430px] mx-auto p-5"><div class="flex justify-between items-center"><button onclick="closeCart()" class="w-9 h-9 bg-white rounded-full font-bold">✕</button><p class="serif text-[18px] font-bold">Your Order</p><div class="w-9"></div></div><div id="cartList" class="mt-6 space-y-2"></div><div class="mt-5 bg-white rounded-[20px] p-4"><input id="cname" placeholder="Full name" class="w-full bg-[#F5F1E9] rounded-full px-4 py-3 text-[12px] outline-none"><input id="cphone" placeholder="07XX XXX XXX" class="w-full bg-[#F5F1E9] rounded-full px-4 py-3 text-[12px] outline-none mt-2"><select id="cloc" onchange="updateDelivery()" class="w-full bg-[#F5F1E9] rounded-full px-4 py-3 text-[12px] outline-none mt-2"><option value="">Select area</option><option value="Kataza">Kataza — 500</option><option value="Kiswa">Kiswa — 1,000</option><option value="Mbuya">Mbuya — 2,000</option><option value="Kinawataka">Kinawataka — 2,000</option><option value="Mutungo">Mutungo — 2,500</option><option value="Luzira">Luzira — 3,000</option><option value="Town">Town — 3,000</option></select><input id="clocDetail" placeholder="Hostel / Room" class="w-full bg-[#F5F1E9] rounded-full px-4 py-3 text-[12px] outline-none mt-2"><textarea id="note" placeholder="Note" class="w-full bg-[#F5F1E9] rounded-[16px] px-4 py-3 text-[12px] outline-none mt-2 h-16"></textarea></div><div class="mt-5 px-2 space-y-1 text-[12px]"><div class="flex justify-between text-black/50"><span>Subtotal</span><span id="sub">UGX 0</span></div><div class="flex justify-between text-black/50"><span>Delivery (<span id="areaName">Kataza</span>)</span><span id="deliveryLabel">UGX 500</span></div><div class="flex justify-between font-bold pt-2 border-t"><span>Total</span><span id="total">UGX 0</span></div></div><button onclick="placeOrder()" id="orderBtn" class="w-full mt-5 bg-[#0A0A0A] text-[#D4B67A] py-4 rounded-full font-bold tracking-[2px] text-[11px]">CONFIRM ORDER</button></div></div>

</div><script>
const firebaseConfig={apiKey:"AIzaSyBXOE8w7uZQA4YwXyqz8b8cMoNsp84n7RY",authDomain:"quickbite-kataza.firebaseapp.com",projectId:"quickbite-kataza",storageBucket:"quickbite-kataza.firebasestorage.app",messagingSenderId:"584517077834",appId:"1:584517077834:web:9465cd7f4183561e880fb3"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
const deliveryFees={Kataza:500,Kiswa:1000,Mbuya:2000,Kinawataka:2000,Mutungo:2500,Luzira:3000,Town:3000};let currentDelivery=500,foods=[],cart=[],activeCat='All',bannerIdx=0,banners=[],autoTimer;

db.collection('banners').orderBy('order').limit(7).onSnapshot(snap=>{
 if(snap.empty){ bannerTrack.innerHTML=`<div class="slide h-full bg-[#111] flex items-center justify-center"><p class="text-white/20 text-xs">No banners</p></div>`; return; }
 banners=snap.docs.map(d=>({id:d.id,...d.data()}));
 bannerTrack.innerHTML=banners.map(b=>`<div class="slide h-full relative"><img src="${b.url}" class="w-full h-full object-cover"><div class="absolute bottom-8 left-5"><p class="text-[#D4B67A] text-[10px] font-bold">${b.title||''}</p></div></div>`).join('');
 dots.innerHTML=banners.map((_,i)=>`<div class="h-1 rounded-full ${i==bannerIdx?'bg-[#D4B67A] w-5':'bg-white/40 w-1'}"></div>`).join('');
 startAuto();
});
function startAuto(){ clearInterval(autoTimer); if(banners.length<=1) return; autoTimer=setInterval(()=>{ let el=bannerTrack; bannerIdx=(bannerIdx+1)%banners.length; el.scrollTo({left:bannerIdx*el.clientWidth,behavior:'smooth'}); dots.innerHTML=banners.map((_,i)=>`<div class="h-1 rounded-full ${i==bannerIdx?'bg-[#D4B67A] w-5':'bg-white/40 w-1'}"></div>`).join(''); },3500); }

db.collection('products').onSnapshot(snap=>{
 if(snap.empty){ menu.innerHTML='<p class="col-span-2 py-20 text-center text-black/30 text-xs">No dishes yet</p>'; return; }
 foods=snap.docs.map(d=>({id:d.id,...d.data()})).filter(f=>f.is_available!==false);
 renderCats();render();
});
function renderCats(){ let list=['All',...new Set(foods.map(f=>f.category).filter(Boolean))]; cats.innerHTML=list.map(c=>`<button onclick="setCat('${c}')" class="whitespace-nowrap px-4 py-2 rounded-full text-[10px] font-bold tracking-widest ${activeCat==c?'bg-[#0A0A0A] text-[#D4B67A]':'bg-white text-black/50'}">${c.toUpperCase()}</button>`).join(''); }
function setCat(c){activeCat=c;renderCats();render();}
function render(){
 let list=activeCat=='All'?foods:foods.filter(f=>f.category==activeCat);
 menu.innerHTML=list.map(f=>`
  <div class="bg-white rounded-[18px] overflow-hidden shadow-sm border border-black/[0.04]">
    <img src="${f.image_url}" class="w-full h-[110px] object-cover">
    <div class="p-3">
      <h3 class="font-bold text-[12px] leading-[1.1] truncate">${f.name}</h3>
      <p class="text-[10px] text-black/40 mt-0.5 truncate">${f.description||''}</p>
      <p class="text-[9px] font-bold tracking-widest text-black/30 mt-1">${(f.category||'').toUpperCase()}</p>
      <div class="flex justify-between items-center mt-2">
        <span class="font-bold text-[12px]">UGX ${Number(f.price).toLocaleString()}</span>
        <button onclick="add('${f.id}')" class="w-7 h-7 bg-[#0A0A0A] text-[#D4B67A] rounded-full text-[14px] flex items-center justify-center">+</button>
      </div>
    </div>
  </div>`).join('');
}

function add(id){let f=foods.find(x=>x.id==id);let e=cart.find(x=>x.id==id);if(e)e.qty++;else cart.push({...f,qty:1});updateBtn();}
function updateBtn(){let c=cart.reduce((a,b)=>a+b.qty,0),t=cart.reduce((a,b)=>a+b.price*b.qty,0);let btn=cartBtn, badge=navBadge; if(c>0){btn.classList.remove('hidden');badge.classList.remove('hidden');badge.innerText=c;cartCount.innerText=c;cartText.innerText=c+' dishes';cartPrice.innerText='UGX '+t.toLocaleString();}else{btn.classList.add('hidden');badge.classList.add('hidden');}}
function openCart(){cartPage.classList.remove('hidden');updateDelivery();}
function closeCart(){cartPage.classList.add('hidden');}
function updateDelivery(){let area=cloc.value||'Kataza';currentDelivery=deliveryFees[area]||500;areaName.innerText=area;deliveryLabel.innerText='UGX '+currentDelivery.toLocaleString();let t=cart.reduce((a,b)=>a+b.price*b.qty,0);cartList.innerHTML=cart.map(f=>`<div class="bg-white rounded-[14px] p-3 flex gap-3 items-center"><img src="${f.image_url}" class="w-12 h-12 rounded-[10px] object-cover"><div class="flex-1"><p class="font-bold text-[11px]">${f.name}</p><p class="text-[10px] text-black/40">UGX ${f.price} x ${f.qty}</p></div><button onclick="removeCart('${f.id}')" class="text-[10px] text-red-500">Remove</button></div>`).join('');sub.innerText='UGX '+t.toLocaleString();total.innerText='UGX '+(t+currentDelivery).toLocaleString();}
function removeCart(id){cart=cart.filter(c=>c.id!=id);updateBtn();updateDelivery();}
async function placeOrder(){if(!cloc.value)return alert('Select area');if(!cname.value||!cphone.value)return alert('Name & phone');if(!cart.length)return alert('Cart empty');orderBtn.innerText='PLACING...';orderBtn.disabled=true;let subtotal=cart.reduce((a,b)=>a+b.price*b.qty,0);let ref=await db.collection('orders').add({customer_name:cname.value,customer_phone:cphone.value,area:cloc.value,location:cloc.value+' - '+clocDetail.value,delivery_fee:currentDelivery,subtotal,total:subtotal+currentDelivery,items:cart.map(i=>({name:i.name,price:i.price,qty:i.qty})),note:note.value,status:'new',created_at:firebase.firestore.FieldValue.serverTimestamp()});alert('Order placed! '+ref.id.slice(0,6).toUpperCase());cart=[];updateBtn();closeCart();orderBtn.innerText='CONFIRM ORDER';orderBtn.disabled=false;location.href='track.html?id='+ref.id;}
</script></body></html>
