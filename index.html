<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Bite Kataza</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#1A1A1A;--card:#2A2A2A;--card2:#333;--text:#fff;--muted:#9CA3AF;--orange:#FF6B00}
.light{--bg:#FFF7ED;--card:#fff;--card2:#F3F4F6;--text:#111;--muted:#6B7280}
body{background:var(--bg);color:var(--text);transition:0.3s}
.card{background:var(--card)}
.card2{background:var(--card2)}
.text-mute{color:var(--muted)}
.orange{color:var(--orange)}
.bg-orange{background:var(--orange)}
</style>
</head>
<body class="">
<div class="max-w-[430px] mx-auto min-h-screen pb-24" style="background:var(--bg)">

<!-- HEADER -->
<div class="p-5 flex justify-between items-center">
<div class="flex items-center gap-2 text-[11px]">🇺🇬 <b>Quick Bite Kataza</b></div>
<button onclick="toggleTheme()" id="themeBtn" class="text-[11px] border px-3 py-1 rounded-full">🌙 Night Mode</button>
</div>

<div class="px-5">
<h1 class="text-[#FF6B00] font-black text-[30px]">QUICK BITE</h1>
<p class="text-[11px] text-mute -mt-1">📍 Kataza, Uganda • Night Delivery</p>

<div class="relative mt-4">
<input id="search" oninput="renderMenu()" placeholder="Search rice, rolex, juice, soda..." class="w-full card rounded-full py-3 px-5 text-[12px] outline-none border border-[#333]">
</div>

<div class="card border border-[#3A2A1A] rounded-2xl p-4 mt-4">
<p class="font-black text-sm">STREET FOOD • NOW OPEN</p>
<p class="text-[11px] orange">Fast • Fresh • Affordable</p>
</div>
</div>

<div id="homeScreen" class="px-5 mt-5">
<p class="font-bold text-sm mb-3">Popular Near You</p>
<div id="popular" class="grid grid-cols-3 gap-2"></div>
<div class="mt-6">
<div class="flex gap-2 mb-3 overflow-x-auto" id="cats"></div>
<div id="menuList"></div>
</div>
</div>

<div id="cartScreen" class="hidden px-5 mt-2">
<div class="flex items-center gap-3 mb-4"><button onclick="showHome()" class="text-xl">‹</button><h2 class="font-black text-lg mx-auto">Your Cart</h2></div>
<div id="cartItems" class="space-y-3"></div>
<div id="cartSummary" class="card rounded-2xl p-4 mt-4 space-y-2 text-[12px]"></div>
<a id="checkoutBtn" href="#" target="_blank" class="block mt-4 bg-orange text-black text-center py-4 rounded-full font-black">Checkout • Pay UGX 0</a>
<p class="text-[10px] text-mute text-center mt-2">✓ Cash on Delivery • Mobile Money Accepted</p>
</div>

<!-- NAV -->
<div class="fixed bottom-0 w-full max-w-[430px] card border-t flex justify-around py-3 z-20" style="border-color:#2A2A2A">
<button onclick="showHome()" class="flex flex-col items-center orange"><span>⌂</span><span class="text-[9px]">Home</span></button>
<button onclick="showCart()" class="flex flex-col items-center text-mute relative"><span>🛒</span><span id="cartCount" class="absolute -top-1 -right-1 bg-orange text-black text-[8px] px-1 rounded-full">0</span><span class="text-[9px]">Cart</span></button>
<button onclick="toggleTheme()" class="flex flex-col items-center text-mute"><span>🌙</span><span class="text-[9px]">Theme</span></button>
</div>

<div id="floatingCart" class="hidden fixed bottom-20 left-1/2 -translate-x-1/2 w-[90%] max-w-[400px] card border rounded-full p-2 flex justify-between items-center z-30">
<span id="floatText" class="text-[11px] font-bold px-3">0 items</span>
<button onclick="showCart()" class="bg-orange text-black text-[11px] font-black px-4 py-2 rounded-full">View Cart →</button>
</div>

</div>
<script>
let isDark=true;
function toggleTheme(){isDark=!isDark;document.documentElement.className=isDark?'':'light';document.body.className=isDark?'':'light';document.getElementById("themeBtn").innerText=isDark?'🌙 Night Mode':'☀️ Light Mode';}
const foods=[
{id:1,n:"Rolex Special",p:5000,cat:"Rolex",d:"Chapati + egg, onions, cabbage & chili",i:"🌯"},
{id:2,n:"Rice with Beans & Beef",p:8000,cat:"Rice",d:"Classic beans, beef stew, onions",i:"🍛"},
{id:3,n:"Crispy Chips Masala",p:4500,cat:"Chips",d:"Spiced chips with kachumbari salsa",i:"🍟"},
{id:4,n:"Fresh Mango Juice",p:3000,cat:"Juice",d:"Cold pressed mango 500ml",i:"🧃"},
{id:5,n:"Soda Coke 500ml",p:2500,cat:"Soda",d:"Ice cold classic",i:"🥤"},
{id:6,n:"Full Plate",p:12000,cat:"Rice",d:"Rice + chips + meat + soda",i:"🍱"},
];
let cart=[], currentCat='All';
function renderPopular(){document.getElementById("popular").innerHTML=foods.slice(0,3).map(f=>`<div class="card rounded-xl overflow-hidden border" style="border-color:#333"><div class="h-16 card2 flex items-center justify-center text-2xl">${f.i}</div><div class="p-2"><p class="text-[10px] font-bold">${f.n}</p><p class="text-[9px] orange font-bold">UGX ${f.p}</p></div></div>`).join("")}
function renderCats(){document.getElementById("cats").innerHTML=['All','Rice','Chips','Rolex','Juice','Soda'].map(c=>`<button onclick="setCat('${c}')" class="${currentCat==c?'bg-orange text-black':'card text-mute'} px-3 py-1.5 rounded-full text-[10px] font-bold border" style="border-color:#333">${c}</button>`).join("")}
function renderMenu(){renderCats();let q=(document.getElementById("search")?.value||"").toLowerCase();let list=foods.filter(f=>(currentCat=='All'||f.cat==currentCat)&&f.n.toLowerCase().includes(q));document.getElementById("menuList").innerHTML=list.map(f=>`<div class="card rounded-2xl p-3 flex gap-3 mb-2 border" style="border-color:#333"><div class="w-14 h-14 card2 rounded-xl flex items-center justify-center text-2xl">${f.i}</div><div class="flex-1"><p class="font-bold text-[12px]">${f.n}</p><p class="text-[10px] text-mute">${f.d}</p><p class="orange font-black text-[11px] mt-1">UGX ${f.p.toLocaleString()}</p></div><button onclick="add(${f.id})" class="w-7 h-7 bg-orange text-black rounded-full font-black">+</button></div>`).join("")}
function setCat(c){currentCat=c;renderMenu();}
function add(id){let f=foods.find(x=>x.id==id);let ex=cart.find(x=>x.id==id);if(ex)ex.qty++;else cart.push({...f,qty:1});updateCart();}
function updateCart(){let total=cart.reduce((a,b)=>a+b.p*b.qty,0);let count=cart.reduce((a,b)=>a+b.qty,0);document.getElementById("cartCount").innerText=count;document.getElementById("floatText").innerText=`${count} items • UGX ${total.toLocaleString()}`;document.getElementById("floatingCart").classList.toggle("hidden",count==0);}
function showCart(){document.getElementById("homeScreen").classList.add("hidden");document.getElementById("cartScreen").classList.remove("hidden");let total=cart.reduce((a,b)=>a+b.p*b.qty,0);let fee=2000;document.getElementById("cartItems").innerHTML=cart.map(f=>`<div class="card rounded-xl p-3 flex justify-between items-center border" style="border-color:#333"><div class="flex gap-3 items-center"><div class="w-10 h-10 card2 rounded-lg flex items-center justify-center">${f.i}</div><div><p class="text-[12px] font-bold">${f.n} x${f.qty}</p><p class="text-[10px] text-mute">Qty ${f.qty}</p></div></div><b class="text-[12px]">UGX ${f.p*f.qty}</b></div>`).join("")||"<p class='text-mute text-center mt-10 text-sm'>Cart empty</p>";document.getElementById("cartSummary").innerHTML=`<div class="flex justify-between text-mute"><span>Delivery Address</span><span class="orange">Change</span></div><p class="text-[11px]">Kataza, Kampala, Uganda</p><div class="pt-3 border-t space-y-1 mt-3" style="border-color:#333"><div class="flex justify-between"><span>Subtotal</span><span>UGX ${total}</span></div><div class="flex justify-between"><span>Delivery Fee</span><span>UGX ${fee}</span></div><div class="flex justify-between font-black orange"><span>Total</span><span>UGX ${total+fee}</span></div></div>`;let msg=`Hello Quick Bite Kataza!%0AOrder:%0A${cart.map(f=>`- ${f.n} x${f.qty} = ${f.p*f.qty} UGX`).join('%0A')}%0ATotal: UGX ${total+fee}%0AAddress: Kataza`;document.getElementById("checkoutBtn").innerText=`Checkout • Pay UGX ${(total+fee).toLocaleString()}`;document.getElementById("checkoutBtn").href=`https://wa.me/256700000000?text=${msg}`;}
function showHome(){document.getElementById("cartScreen").classList.add("hidden");document.getElementById("homeScreen").classList.remove("hidden");}
renderPopular();renderMenu();
</script>
</body>
</html>
