<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Mr. Tum Tum</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Instrument+Sans:wght@400;500;700&display=swap" rel="stylesheet"><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script><style>body{font-family:'Instrument Sans',sans-serif;background:#F5F1E9}.serif{font-family:'Cormorant Garamond',serif}.scrollbar-hide::-webkit-scrollbar{display:none}.carousel{scroll-snap-type:x mandatory;scroll-behavior:smooth}.slide{scroll-snap-align:start;flex:0 0 100%}</style></head><body><div class="max-w-[430px] mx-auto bg-[#F5F1E9] min-h-screen relative shadow-2xl pb-[90px]">

<div class="relative h-[320px] overflow-hidden bg-black rounded-b-[28px]">
<div id="bannerTrack" class="flex w-full h-full overflow-x-auto carousel scrollbar-hide"></div>
<div id="dots" class="absolute bottom-[20px] left-1/2 -translate-x-1/2 flex gap-1.5 z-10"></div>
<div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-black/40 pointer-events-none"></div>
<div class="absolute top-0 left-0 right-0 p-4 pt-6 z-20 flex justify-between items-center">
<div class="flex items-center gap-2"><div class="w-7 h-7 bg-[#D4B67A]/20 rounded-full flex items-center justify-center">📍</div><div class="leading-[1.1]"><p class="text-white/60 text-[9px] tracking-[2px] font-bold">DELIVER TO</p><p class="text-white text-[13px] font-bold" id="deliverLabel">Kataza, Makindye</p></div></div>
<button onclick="openProfile()" class="w-9 h-9 bg-[#0A0A0A] border border-[#D4B67A]/40 rounded-full flex items-center justify-center text-[#D4B67A]">👤</button>
</div>
<div class="absolute bottom-0 left-0 right-0 p-5 z-10"><p class="text-[#D4B67A] text-[9px] tracking-[3px] font-bold">MR. TUM TUM • REAL FOOD • FAST</p><h1 class="serif text-white text-[32px] leading-[0.9] mt-1 font-bold">Mr. Tum <span class="text-[#D4B67A] italic">Tum</span></h1></div>
</div>

<div class="sticky top-0 bg-[#F5F1E9]/95 backdrop-blur-md z-20 px-4 py-4">
<div class="flex justify-between overflow-x-auto scrollbar-hide gap-3" id="iconCats"></div>
<div id="cats" class="flex gap-2 overflow-x-auto scrollbar-hide mt-3"></div>
</div>

<div id="menu" class="px-3 grid grid-cols-2 gap-3 mt-1"></div>
<div id="emptyMsg" class="hidden col-span-2 py-20 text-center text-black/30 text-xs">No dishes in this category yet</div>

<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] bg-white/95 backdrop-blur-md border-t border-black/5 px-2 py-2 flex justify-around items-center z-40 rounded-t-[24px] shadow-[0_-10px_30px_rgba(0,0,0,0.06)]">
<button onclick="goHome()" class="flex flex-col items-center gap-1 px-5 py-1.5 rounded-full bg-[#0A0A0A] text-[#D4B67A]"><span class="text-[16px]">⌂</span><span class="text-[9px] font-bold tracking-widest">HOME</span></button>
<button onclick="goMenu()" class="flex flex-col items-center gap-1 px-4 py-1.5"><span class="text-[16px]">☰</span><span class="text-[9px] font-bold">MENU</span></button>
<button onclick="openCart()" class="flex flex-col items-center gap-1 px-4 py-1.5 relative"><span class="text-[16px]">🛒</span><span class="text-[9px] font-bold">CART</span><span id="navBadge" class="hidden absolute -top-1 right-1 bg-[#D4B67A] text-black text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span></button>
<a href="track.html" class="flex flex-col items-center gap-1 px-4 py-1.5"><span class="text-[16px]">◍</span><span class="text-[9px] font-bold">TRACK</span></a>
</div>

<div id="cartBtn" class="hidden fixed bottom-[88px] left-1/2 -translate-x-1/2 w-[90%] max-w-[380px] bg-[#0A0A0A] rounded-full p-2 pl-5 pr-2 flex justify-between items-center shadow-xl z-30"><div class="flex items-center gap-3"><div class="w-9 h-9 bg-[#D4B67A] rounded-full flex items-center justify-center text-black font-bold text-xs" id="cartCount">0</div><div><p class="text-white text-[11px] font-bold" id="cartText">0 dishes</p><p class="text-[#D4B67A] text-[10px]" id="cartPrice">UGX 0</p></div></div><button onclick="openCart()" class="bg-white text-black px-6 py-2.5 rounded-full text-[10px] font-bold">VIEW →</button></div>

<div id="cartPage" class="hidden fixed inset-0 bg-[#F5F1E9] z-[60] overflow-y-auto"><div class="max-w-[430px] mx-auto p-5"><div class="flex justify-between items-center"><button onclick="closeCart()" class="w-9 h-9 bg-white rounded-full font-bold">✕</button><p class="serif text-[18px] font-bold">Your Order - Mr. Tum Tum</p><div class="w-9"></div></div><div id="cartList" class="mt-6 space-y-3"></div><div class="mt-5 bg-white rounded-[20px] p-4"><input id="cname" placeholder="Full name" class="w-full bg-[#F5F1E9] rounded-full px-4 py-3 text-[12px] outline-none"><input id="cphone" placeholder="07XX XXX XXX" class="w-full bg-[#F5F1E9] rounded-full px-4 py-3 text-[12px] outline-none mt-2"><select id="cloc" onchange="updateDelivery()" class="w-full bg-[#F5F1E9] rounded-full px-4 py-3 text-[12px] outline-none mt-2"><option value="">Select area</option><option value="Kataza">Kataza — 500</option><option value="Kiswa">Kiswa — 1,000</option><option value="Mbuya">Mbuya — 2,000</option><option value="Kinawataka">Kinawataka — 2,000</option><option value="Mutungo">Mutungo — 2,500</option><option value="Luzira">Luzira — 3,000</option><option value="Town">Town — 3,000</option></select><input id="clocDetail" placeholder="Hostel / Room" class="w-full bg-[#F5F1E9] rounded-full px-4 py-3 text-[12px] outline-none mt-2"><textarea id="note" placeholder="Note" class="w-full bg-[#F5F1E9] rounded-[16px] px-4 py-3 text-[12px] outline-none mt-2 h-16"></textarea></div><div class="mt-5 px-2 space-y-1 text-[12px]"><div class="flex justify-between text-black/50"><span>Subtotal</span><span id="sub">UGX 0</span></div><div class="flex justify-between text-black/50"><span>Delivery (<span id="areaName">Kataza</span>)</span><span id="deliveryLabel2">UGX 500</span></div><div class="flex justify-between font-bold pt-2 border-t"><span>Total</span><span id="total">UGX 0</span></div></div><button onclick="placeOrder()" id="orderBtn" class="w-full mt-5 bg-[#0A0A0A] text-[#D4B67A] py-4 rounded-full font-bold tracking-[2px] text-[11px]">CONFIRM ORDER</button></div></div>

<div id="profileSheet" class="hidden fixed inset-0 bg-black/50 z-[70] flex items-end"><div class="w-full max-w-[430px] mx-auto bg-white rounded-t-[28px] p-6 pb-10"><div class="w-10 h-1 bg-black/10 rounded-full mx-auto mb-4"></div><div class="flex justify-between items-center"><div><p class="text-[9px] tracking-[2px] text-black/30 font-bold">PROFILE - MR. TUM TUM</p><p class="font-bold text-[16px]" id="profName">Guest</p><p class="text-[11px] text-black/40" id="profPhone">Not logged</p></div><button onclick="closeProfile()" class="w-9 h-9 bg-[#F5F1E9] rounded-full">✕</button></div><button onclick="location.href='track.html'" class="w-full mt-6 bg-[#0A0A0A] text-[#D4B67A] py-3 rounded-full text-[11px] font-bold">MY ORDERS →</button></div></div>

</div><script>
const firebaseConfig={apiKey:"AIzaSyBXOE8w7uZQA4YwXyqz8b8cMoNsp84n7RY",authDomain:"quickbite-kataza.firebaseapp.com",projectId:"quickbite-kataza",storageBucket:"quickbite-kataza.firebasestorage.app",messagingSenderId:"584517077834",appId:"1:584517077834:web:9465cd7f4183561e880fb3"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
const deliveryFees={Kataza:500,Kiswa:1000,Mbuya:2000,Kinawataka:2000,Mutungo:2500,Luzira:3000,Town:3000};let currentDelivery=500,foods=[],cart=[],activeCat='All',bannerIdx=0,banners=[],autoTimer;
const MENU_LIST=['All','Rolex','Fries','Sausage','Samosas','Rice','Juice','Soda'];
const CATEGORY_ICONS={Rolex:'🌯',Fries:'🍟',Sausage:'🌭',Samosas:'🥟',Rice:'🍚',Juice:'🧃',Soda:'🥤',All:'🍽️'};

db.collection('banners').orderBy('order').limit(7).onSnapshot(snap=>{
 if(snap.empty){ bannerTrack.innerHTML=`<div class="slide h-full bg-[#111] flex items-center justify-center"><p class="text-white/20 text-xs">No banners</p></div>`; return; }
 banners=snap.docs.map(d=>({id:d.id,...d.data()}));
 bannerTrack.innerHTML=banners.map(b=>`<div class="slide h-full relative"><img src="${b.url}" class="w-full h-full object-cover"><div class="absolute bottom-8 left-5"><p class="text-[#D4B67A] text-[10px] font-bold">${b.title||''}</p></div></div>`).join('');
 dots.innerHTML=banners.map((_,i)=>`<div class="h-1 rounded-full ${i==bannerIdx?'bg-[#D4B67A] w-5':'bg-white/40 w-1'}"></div>`).join('');
 startAuto();
});
function startAuto(){ clearInterval(autoTimer); if(banners.length<=1) return; autoTimer=setInterval(()=>{ let el=bannerTrack; bannerIdx=(bannerIdx+1)%banners.length; el.scrollTo({left:bannerIdx*el.clientWidth,behavior:'smooth'}); dots.innerHTML=banners.map((_,i)=>`<div class="h-1 rounded-full ${i==bannerIdx?'bg-[#D4B67A] w-5':'bg-white/40 w-1'}"></div>`).join(''); },3500); }

db.collection('products').onSnapshot(snap=>{
 foods=snap.docs.map(d=>({id:d.id,...d.data()})).filter(f=>f.is_available!==false);
 renderCats();renderIconCats();render();
});

function renderIconCats(){
  iconCats.innerHTML=MENU_LIST.map(c=>{
   let isActive=activeCat==c;
   return `<button onclick="setCat('${c}')" class="flex flex-col items-center gap-1.5 min-w-[56px]">
   <div class="w-[52px] h-[52px] rounded-full ${isActive?'bg-[#0A0A0A] border-[#0A0A0A]':'bg-white border-[#D4B67A]/30'} border flex items-center justify-center text-[22px] shadow-sm"><span class="${isActive?'text-[#D4B67A]':''}">${CATEGORY_ICONS[c]||'🍴'}</span></div>
   <p class="text-[9px] font-bold tracking-widest ${isActive?'text-black':'text-black/50'} uppercase">${c}</p>
   </button>`;
  }).join('');
}
function renderCats(){ cats.innerHTML=MENU_LIST.map(c=>`<button onclick="setCat('${c}')" class="whitespace-nowrap px-4 py-2 rounded-full text-[10px] font-bold tracking-widest ${activeCat==c?'bg-[#0A0A0A] text-[#D4B67A]':'bg-white text-black/50'}">${c.toUpperCase()}</button>`).join(''); }

function setCat(c){activeCat=c;renderCats();renderIconCats();render();}
function goMenu(){activeCat='All';renderCats();renderIconCats();render();document.getElementById('iconCats').scrollIntoView({behavior:'smooth'});setTimeout(()=>{document.getElementById('menu').scrollIntoView({behavior:'smooth',block:'start'}); window.scrollBy(0,-80);},300);}
function goHome(){window.scrollTo({top:0,behavior:'smooth'}); activeCat='All'; renderCats();renderIconCats();render();}

function render(){
 let list=activeCat=='All'?foods:foods.filter(f=>f.category==activeCat);
 if(!list.length){ menu.innerHTML=''; document.getElementById('emptyMsg').classList.remove('hidden'); if(activeCat!='All') document.getElementById('emptyMsg').innerText='No '+activeCat+' yet — add in admin'; return; }
 document.getElementById('emptyMsg').classList.add('hidden');
 menu.innerHTML=list.map(f=>{
  let inCart=cart.find(x=>x.id==f.id);
  return `<div class="bg-white rounded-[18px] overflow-hidden shadow-sm border border-black/[0.04]"><img src="${f.image_url}" class="w-full h-[110px] object-cover"><div class="p-3"><h3 class="font-bold text-[12px] leading-[1.1] truncate">${f.name}</h3><p class="text-[10px] text-black/40 mt-0.5 truncate">${f.description||''}</p><div class="flex justify-between items-center mt-2"><span class="font-bold text-[12px]">UGX ${Number(f.price).toLocaleString()}</span>${inCart?`<div class="flex items-center gap-1 bg-black rounded-full px-1 py-1"><button onclick="decQty('${f.id}')" class="w-6 h-6 bg-white/20 text-[#D4B67A] rounded-full text-[12px]">-</button><span class="text-white text-[11px] font-bold w-5 text-center">${inCart.qty}</span><button onclick="incQty('${f.id}')" class="w-6 h-6 bg-[#D4B67A] text-black rounded-full text-[12px]">+</button></div>`:`<button onclick="add('${f.id}')" class="w-7 h-7 bg-[#0A0A0A] text-[#D4B67A] rounded-full text-[14px] flex items-center justify-center">+</button>`}</div></div></div>`;
 }).join('');
}

function add(id){let f=foods.find(x=>x.id==id);let e=cart.find(x=>x.id==id);if(e)e.qty++;else cart.push({...f,qty:1});updateBtn();render();}
function incQty(id){let e=cart.find(x=>x.id==id);if(e){e.qty++;updateBtn();render();updateDelivery();}}
function decQty(id){let e=cart.find(x=>x.id==id);if(e){e.qty--;if(e.qty<=0){cart=cart.filter(x=>x.id!=id);}updateBtn();render();updateDelivery();}}
function updateBtn(){let c=cart.reduce((a,b)=>a+b.qty,0),t=cart.reduce((a,b)=>a+b.price*b.qty,0);let btn=cartBtn,badge=navBadge;if(c>0){btn.classList.remove('hidden');badge.classList.remove('hidden');badge.innerText=c;cartCount.innerText=c;cartText.innerText=c+' dishes';cartPrice.innerText='UGX '+t.toLocaleString();}else{btn.classList.add('hidden');badge.classList.add('hidden');}}
function openCart(){cartPage.classList.remove('hidden');updateDelivery();}
function closeCart(){cartPage.classList.add('hidden');}
function openProfile(){profileSheet.classList.remove('hidden'); profName.innerText=localStorage.getItem('customerName')||'Guest'; profPhone.innerText=localStorage.getItem('customerPhone')||'Tap Track to see orders';}
function closeProfile(){profileSheet.classList.add('hidden');}
function updateDelivery(){
 let area=cloc.value||'Kataza';currentDelivery=deliveryFees[area]||500;areaName.innerText=area;document.getElementById('deliveryLabel2').innerText='UGX '+currentDelivery.toLocaleString(); document.getElementById('deliverLabel').innerText=area+', Makindye';
 let t=cart.reduce((a,b)=>a+b.price*b.qty,0);
 cartList.innerHTML=cart.map(f=>`<div class="bg-white rounded-[14px] p-3 flex gap-3 items-center"><img src="${f.image_url}" class="w-12 h-12 rounded-[10px] object-cover"><div class="flex-1"><p class="font-bold text-[11px]">${f.name}</p><p class="text-[10px] text-black/40">UGX ${f.price.toLocaleString()}</p></div><div class="flex items-center gap-2 bg-[#F5F1E9] rounded-full px-2 py-1"><button onclick="decQty('${f.id}')" class="w-7 h-7 bg-white rounded-full font-bold shadow-sm">-</button><span class="font-bold text-[12px] w-4 text-center">${f.qty}</span><button onclick="incQty('${f.id}')" class="w-7 h-7 bg-black text-[#D4B67A] rounded-full font-bold">+</button></div></div>`).join('') || '<p class="text-center text-xs py-6 text-black/30">Cart empty</p>';
 sub.innerText='UGX '+t.toLocaleString();total.innerText='UGX '+(t+currentDelivery).toLocaleString();
}
async function placeOrder(){
 if(!cloc.value)return alert('Select area'); if(!cname.value||!cphone.value)return alert('Name & phone'); if(!cart.length)return alert('Cart empty');
 orderBtn.innerText='PLACING...';orderBtn.disabled=true; let subtotal=cart.reduce((a,b)=>a+b.price*b.qty,0);
 try{
  let deliveryCode=Math.floor(1000+Math.random()*9000).toString();
  let ref=await db.collection('orders').add({customer_name:cname.value,customer_phone:cphone.value,area:cloc.value,location:cloc.value+' - '+clocDetail.value,delivery_fee:currentDelivery,subtotal,total:subtotal+currentDelivery,items:cart.map(i=>({name:i.name,price:i.price,qty:i.qty,category:i.category})),note:note.value,status:'new',delivery_code:deliveryCode,admin_message:'',created_at:firebase.firestore.FieldValue.serverTimestamp()});
  const fullId=ref.id; localStorage.setItem('lastOrderId',fullId); localStorage.setItem('lastOrderIdShort',fullId.slice(0,8).toUpperCase()); localStorage.setItem('customerName',cname.value); localStorage.setItem('customerPhone',cphone.value); localStorage.setItem('cart',JSON.stringify([]));
  cart=[];updateBtn();closeCart(); orderBtn.innerText='CONFIRM ORDER';orderBtn.disabled=false;
  // CODE HIDDEN FROM CUSTOMER - RIDER WILL GIVE CODE AT DELIVERY
  alert('Order placed! Mr. Tum Tum is preparing. Rider will give you a code at delivery to confirm & get receipt.');
  location.href='track.html?id='+fullId;
 }catch(e){alert('Failed: '+e.message); orderBtn.innerText='CONFIRM ORDER';orderBtn.disabled=false;}
}
</script></body></html>
