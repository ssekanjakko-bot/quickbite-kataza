<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Bite Kataza | Premium</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>body{font-family:Inter;background:#FAF6F0}.serif{font-family:Cormorant Garamond}</style>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
</head><body class="text-[#0A0A0A]">
<div class="max-w-[480px] mx-auto min-h-screen bg-[#FAF6F0] relative pb-28">
<div class="bg-[#0A0A0A] text-[#FAF6F0] p-6">
<p class="text-[#C6A86A] text-[10px] tracking-[3px]">EST • KATAZA</p>
<h1 class="serif text-[32px] leading-none mt-2">Quick Bite<br><span class="text-[#C6A86A]">Kataza</span></h1>
<p class="text-[11px] text-[#9A9A9A] mt-3">Authentic grill • Slow cooked • Served fresh</p>
</div>
<div id="cats" class="flex gap-2 p-4 overflow-x-auto text-[11px]"></div>
<div id="menu" class="px-4 space-y-4"></div>
<div id="cartBtn" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 w-[90%] max-w-[440px] bg-[#0A0A0A] text-[#FAF6F0] rounded-full py-4 px-6 flex justify-between items-center z-30">
<span id="cartInfo" class="text-[12px]">0 items</span><button onclick="openCart()" class="text-[#C6A86A] text-[12px] font-bold tracking-widest">VIEW CART →</button>
</div>
<div id="cartPage" class="hidden fixed inset-0 bg-[#FAF6F0] z-40 p-6 overflow-y-auto">
<button onclick="closeCart()" class="text-[20px]">←</button><h2 class="serif text-[28px] mt-4">Your Order</h2>
<div id="cartList" class="mt-6 space-y-3"></div>
<div class="mt-8 bg-white rounded-[16px] p-4">
<input id="cname" placeholder="Your name" class="w-full border-b py-3 text-sm outline-none">
<input id="cphone" placeholder="Phone 07..." class="w-full border-b py-3 text-sm outline-none mt-2">
<input id="cloc" placeholder="Table No. or Hostel (e.g Table 5)" class="w-full border-b py-3 text-sm outline-none mt-2">
<textarea id="note" placeholder="Note e.g No onions" class="w-full border-b py-3 text-sm outline-none mt-2"></textarea>
</div>
<div class="mt-6 flex justify-between text-sm"><span>Subtotal</span><span id="sub">UGX 0</span></div>
<div class="flex justify-between text-sm mt-1"><span>Delivery</span><span>UGX 2,000</span></div>
<div class="flex justify-between font-bold mt-3 pt-3 border-t"><span>Total</span><span id="total" class="text-[#C6A86A]">UGX 0</span></div>
<button onclick="placeOrder()" id="orderBtn" class="w-full mt-6 bg-[#0A0A0A] text-[#C6A86A] py-4 rounded-full tracking-[2px] text-[12px] font-bold">PLACE ORDER</button>
</div></div>
<script>
const firebaseConfig = { apiKey: "YOUR_KEY", authDomain: "YOUR_DOMAIN", projectId: "YOUR_PROJECT_ID", storageBucket: "YOUR_BUCKET", appId: "YOUR_APP_ID" };
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
let foods=[], cart=[], activeCat='All';
db.collection('products').where('is_available','==',true).onSnapshot(snap=>{foods=snap.docs.map(d=>({id:d.id,...d.data()}));renderCats();render();});
function renderCats(){let cats=['All',...new Set(foods.map(f=>f.category))];document.getElementById('cats').innerHTML=cats.map(c=>`<button onclick="setCat('${c}')" class="whitespace-nowrap px-4 py-2 rounded-full border ${activeCat==c?'bg-[#0A0A0A] text-[#FAF6F0] border-[#0A0A0A]':'border-[#E5DDD0]'}">${c}</button>`).join('');}
function setCat(c){activeCat=c;renderCats();render();}
function render(){let list=activeCat=='All'?foods:foods.filter(f=>f.category==activeCat);document.getElementById('menu').innerHTML=list.map(f=>`<div class="bg-white rounded-[20px] overflow-hidden flex"><img src="${f.image_url}" class="w-[110px] h-[110px] object-cover"><div class="p-4 flex-1"><p class="serif text-[17px] leading-tight">${f.name}</p><p class="text-[11px] text-[#8A8A8A] mt-1">${f.description||''}</p><div class="flex justify-between items-center mt-3"><span class="font-bold text-[13px]">UGX ${f.price.toLocaleString()}</span><button onclick="add('${f.id}')" class="w-7 h-7 rounded-full bg-[#0A0A0A] text-[#C6A86A]">+</button></div></div></div>`).join('');}
function add(id){let f=foods.find(x=>x.id==id);let e=cart.find(x=>x.id==id);if(e)e.qty++;else cart.push({...f,qty:1});updateBtn();}
function updateBtn(){let c=cart.reduce((a,b)=>a+b.qty,0),t=cart.reduce((a,b)=>a+b.price*b.qty,0);let b=document.getElementById('cartBtn');if(c>0){b.classList.remove('hidden');document.getElementById('cartInfo').innerText=`${c} items • UGX ${t.toLocaleString()}`;}else b.classList.add('hidden');}
function openCart(){document.getElementById('cartPage').classList.remove('hidden');let t=cart.reduce((a,b)=>a+b.price*b.qty,0);document.getElementById('cartList').innerHTML=cart.map(f=>`<div class="flex gap-3 bg-white p-3 rounded-xl"><img src="${f.image_url}" class="w-12 h-12 rounded-lg object-cover"><div class="flex-1"><p class="text-[13px] font-semibold">${f.name}</p><p class="text-[11px]">UGX ${f.price} x ${f.qty}</p></div><span class="font-bold text-[12px]">UGX ${(f.price*f.qty).toLocaleString()}</span></div>`).join('');document.getElementById('sub').innerText=`UGX ${t.toLocaleString()}`;document.getElementById('total').innerText=`UGX ${(t+2000).toLocaleString()}`;}
function closeCart(){document.getElementById('cartPage').classList.add('hidden');}
async function placeOrder(){let btn=document.getElementById('orderBtn');btn.innerText='PLACING...';let total=cart.reduce((a,b)=>a+b.price*b.qty,0)+2000;await db.collection('orders').add({customer_name:cname.value,customer_phone:cphone.value,location:cloc.value,note:note.value,total,delivery_fee:2000,items:cart,status:'new',created_at:firebase.firestore.FieldValue.serverTimestamp()});alert('Order placed!');cart=[];updateBtn();closeCart();btn.innerText='PLACE ORDER';}
</script></body></html>
