<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script></head><body class="bg-[#F5F1E9] p-6"><div class="max-w-[430px] mx-auto"><h1 class="serif text-3xl font-bold">Track Order</h1><input id="oid" placeholder="Enter Order ID" class="w-full bg-white rounded-full px-5 py-4 mt-6 text-sm outline-none"><button onclick="track()" class="w-full bg-black text-[#D4B67A] py-4 rounded-full mt-3 font-bold text-xs tracking-widest">TRACK</button><div id="result" class="mt-8"></div></div><script>const firebaseConfig={apiKey:"AIzaSyBXOE8w7uZQA4YwXyqz8b8cMoNsp84n7RY",authDomain:"quickbite-kataza.firebaseapp.com",projectId:"quickbite-kataza",storageBucket:"quickbite-kataza.firebasestorage.app",messagingSenderId:"584517077834",appId:"1:584517077834:web:9465cd7f4183561e880fb3"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();const params=new URLSearchParams(location.search);if(params.get('id')){oid.value=params.get('id');track();}async function track(){if(!oid.value)return alert('Enter ID');let doc=await db.collection('orders').doc(oid.value.trim()).get();if(!doc.exists)return result.innerHTML='<p class="text-red-500">Not found</p>';let o=doc.data();result.innerHTML=`<div class="bg-white rounded-[24px] p-6"><p class="text-xs tracking-widest">STATUS</p><h2 class="text-2xl font-bold mt-2 uppercase ${o.status=='new'?'text-red-500':o.status=='preparing'?'text-orange-500':'text-green-600'}">${o.status}</h2><div class="mt-6 space-y-1 text-sm"><p><b>${o.customer_name}</b> • ${o.area}</p><p>${o.location}</p><p>${o.items.map(i=>i.name+' x'+i.qty).join(', ')}</p><p class="font-bold mt-3">Total UGX ${o.total} (Delivery ${o.delivery_fee})</p></div></div>`;db.collection('orders').doc(oid.value.trim()).onSnapshot(d=>{if(d.exists){let o=d.data();let el=result.querySelector('h2');if(el){el.innerText=o.status;el.className='text-2xl font-bold mt-2 uppercase '+(o.status=='new'?'text-red-500':o.status=='preparing'?'text-orange-500':'text-green-600');}}});}</script></body></html>
